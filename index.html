        async function fetchAPI(url, options) {
            let delay=500;
            for(let i=0;i<3;i++) {
                try { const res = await fetch(url, options); if(res.ok) return res; await new Promise(r=>setTimeout(r,delay)); delay*=2; }
                catch(e) { if(i==2) throw e; }
            }
        }

            let sysPrompt = mode === 'translate'

                : `당신은 유쾌한 '${targetName}' 원어민 튜터다. 사용자가 '${targetName}'로 말하면 친구처럼 맞장구치며 대화를 이어가고, 다른 언어로 말하면 자연스럽게 해석하며 '${targetName}' 대화로 유도해라. 대화는 1~2문장으로 짧게. 반드시 JSON 형식으로만 응답해라: {"foreign_text":"오직 ${targetName}로만 작성된 당신의 답변","korean_translation":"답변의 정확한 한글 해석 및 사용자 문법 교정"}`;

            try {
                let foreign="", korean="";
                if(selectedEngine==='gemini') {
                    if(mode==='tutor' && conversationHistory.length===0) conversationHistory.push({role:"user",parts:[{text:"Hi"}]},{role:"model",parts:[{text:JSON.stringify({foreign_text:"Hello! Let's talk.",korean_translation:"안녕! 대화하자."})}]});
                    let ctx = mode==='translate'?[]:conversationHistory;
                    ctx.push({role:"user",parts:[{text:`[입력:${inputName}] ${text}`}]});
                    if(ctx.length>8) ctx.shift();
                    
                    let res = await fetchAPI(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:ctx,systemInstruction:{parts:[{text:sysPrompt}]},generationConfig:{responseMimeType:"application/json"}})});
                    let data = await res.json();

                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    if(mode==='tutor') conversationHistory.push({role:"model",parts:[{text:JSON.stringify(parsed)}]});
                    else ctx.pop();
                } else if (selectedEngine === 'groq' || selectedEngine === 'deepseek') {
                    // Groq와 DeepSeek은 OpenAI API 호환 형식을 사용

                        if(ctx.length>9) ctx=[ctx[0], ...ctx.slice(-8)];
                    }

                    let apiUrl = selectedEngine === 'groq' ? "https://api.groq.com/openai/v1/chat/completions" : "https://api.deepseek.com/v1/chat/completions";
                    let apiKey = selectedEngine === 'groq' ? groqApiKey : deepseekApiKey;
                    // Groq은 llama3-8b-8192 모델 사용 (속도 매우 빠르고 성능 좋음)
                    let modelName = selectedEngine === 'groq' ? "llama3-8b-8192" : "deepseek-chat";

                    let res = await fetchAPI(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},body:JSON.stringify({model:modelName,messages:ctx,response_format:{type:"json_object"}})});
                    let data = await res.json();
                    let parsed = JSON.parse(data.choices[0].message.content);
                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    if(mode==='tutor') conversationHistory.push({role:"assistant",content:JSON.stringify(parsed)});
                }
                
                if(foreign) {
                    addMessageToChat('ai', foreign, korean, targetLang);
                    speakText(foreign, targetLang);
                }
            } catch(e) { 
                console.error("API Error", e);
                updateStatus(`통신 오류 (${selectedEngine})`); 
                avatarWrap.style.borderColor="#ef4444"; 
            }
        }
