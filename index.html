<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-panel: rgba(16, 25, 40, 0.7);
            --neon-cyan: #00f3ff;
            --neon-cyan-dim: rgba(0, 243, 255, 0.2);
            --text-main: #e2e8f0;
            --text-muted: #829ab1;
            --chat-font-size: 15px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            /* 사이버펑크 그리드 배경 */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center bottom;
        }

        h1, h2, h3, .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        /* 유리 질감 패널 스타일 */
        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.05);
            border-radius: 12px;
        }

        /* 네온 텍스트 및 효과 */
        .text-neon {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan-dim), 0 0 10px var(--neon-cyan-dim);
        }

        .border-neon {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan-dim);
        }

        /* 사이드바 스타일 */
        .sidebar {
            width: 80px;
            background: linear-gradient(to right, rgba(6, 11, 25, 0.9), rgba(10, 14, 23, 0.8));
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            flex-col;
            align-items: center;
            padding: 20px 0;
            z-index: 10;
        }

        .nav-item {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* 아바타 스타일 */
        .avatar-mini {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transition: all 0.3s ease;
        }

        .speaking-pulse {
            animation: neon-pulse 1.5s infinite alternate;
        }

        @keyframes neon-pulse {
            0% { box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan); transform: scale(1); }
            100% { box-shadow: 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-cyan); transform: scale(1.05); }
        }

        /* 메인 컨텐츠 영역 */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            padding: 24px;
            height: 100vh;
        }

        /* 채팅 영역 */
        .chat-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: var(--chat-font-size);
            line-height: 1.5;
            position: relative;
        }

        .chat-user {
            align-self: flex-end;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom-right-radius: 2px;
        }

        .chat-ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }

        .translation-text {
            font-size: 0.85em;
            color: var(--text-muted);
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            padding-top: 8px;
        }

        /* 하단 컨트롤 바 */
        .control-bar {
            padding: 16px;
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(10, 14, 23, 0.5);
            border-radius: 0 0 12px 12px;
        }

        .mic-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2), 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .mic-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.4), 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .mic-btn.listening {
            border-color: #ff3366;
            color: #ff3366;
            box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.4), 0 0 20px rgba(255, 51, 102, 0.4);
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { box-shadow: inset 0 0 10px rgba(255, 51, 102, 0.2), 0 0 10px rgba(255, 51, 102, 0.2); }
            to { box-shadow: inset 0 0 30px rgba(255, 51, 102, 0.6), 0 0 30px rgba(255, 51, 102, 0.6); }
        }

        .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover:not(:disabled) {
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* 우측 사이드 패널 */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .widget {
            padding: 16px;
        }
        
        .widget-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 커스텀 셀렉트, 인풋 */
        select, input[type="password"], input[type="range"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: white;
            border-radius: 6px;
            padding: 8px;
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }
        
        select option {
            background: var(--bg-dark);
            color: white;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.5); }

        .dynamic-text { font-size: var(--chat-font-size); }
    </style>
</head>
<body>

    <!-- 사이드바 네비게이션 -->
    <div class="sidebar flex flex-col items-center">
        <!-- 아바타 -->
        <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-mini" id="avatarImage" onerror="this.src='https://placehold.co/100x100/0a0e17/00f3ff?text=AI'">
        
        <!-- 메뉴 아이콘 -->
        <div class="nav-item active" title="Chat" onclick="switchTab('chat')"><i class="fa-solid fa-message"></i></div>
        <div class="nav-item" title="Settings" onclick="toggleSettingsModal()"><i class="fa-solid fa-gear"></i></div>
        
        <div class="mt-auto mb-4 text-[10px] text-gray-500 font-tech flex flex-col items-center">
            <span>SYS</span>
            <span class="text-neon">ONLINE</span>
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-content w-full max-w-[1400px] mx-auto">
        
        <!-- 중앙: 대화 콘솔 -->
        <div class="glass-panel chat-section relative flex flex-col">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[rgba(0,243,255,0.02)] pointer-events-none rounded-xl"></div>
            
            <!-- 상단 상태바 -->
            <div class="p-4 border-b border-[rgba(0,243,255,0.1)] flex justify-between items-center bg-[rgba(0,0,0,0.2)] rounded-t-xl z-10">
                <h2 class="font-tech text-xl tracking-wider text-neon">CONVERSATION LOG <span id="statusText" class="text-xs text-gray-400 ml-2 animate-pulse">[ STANDBY ]</span></h2>
                <div class="flex gap-2">
                    <select id="targetLanguage" class="text-xs py-1 w-auto" onchange="changeLanguage()">
                        <option value="en-US" data-lang-name="영어">EN - English</option>
                        <option value="es-ES" data-lang-name="스페인어">ES - Español</option>
                        <option value="ja-JP" data-lang-name="일본어">JA - 日本語</option>
                        <option value="zh-CN" data-lang-name="중국어">ZH - 中文</option>
                        <option value="th-TH" data-lang-name="태국어">TH - ไทย</option>
                        <option value="vi-VN" data-lang-name="베트남어">VI - Tiếng Việt</option>
                        <option value="ko-KR" data-lang-name="한국어">KO - 한국어</option>
                    </select>
                </div>
            </div>

            <!-- 채팅 내역 -->
            <div id="chatContainer" class="chat-container z-10">
                <div class="chat-bubble chat-ai">
                    <p class="font-tech text-neon mb-1 text-xs">SYSTEM INIT...</p>
                    <p class="dynamic-text">환영합니다. 목표 언어를 설정하고 하단 마이크를 통해 음성 명령을 입력하십시오.</p>
                </div>
            </div>

            <!-- 하단 컨트롤 -->
            <div class="control-bar z-10 relative">
                <!-- 입력 모드 토글 (한국어 / 외국어) -->
                <div class="absolute left-6 flex bg-[rgba(0,0,0,0.4)] rounded-md border border-[rgba(0,243,255,0.2)] overflow-hidden text-xs font-tech">
                    <button id="inputLangKo" class="px-3 py-1.5 bg-[rgba(0,243,255,0.2)] text-neon" onclick="setInputLanguage('ko')">KR_INPUT</button>
                    <button id="inputLangTarget" class="px-3 py-1.5 text-gray-400 hover:text-white" onclick="setInputLanguage('target')">TG_INPUT</button>
                </div>

                <button id="stopAudioBtn" class="action-btn" onclick="stopSpeaking()" disabled><i class="fa-solid fa-volume-xmark"></i></button>
                <button id="micBtn" class="mic-btn" onclick="toggleListening()"><i id="micIcon" class="fa-solid fa-microphone"></i></button>
                <button id="explainBtn" class="action-btn" onclick="requestExplanation()" title="문법 분석"><i class="fa-solid fa-crosshairs"></i></button>
            </div>
        </div>

        <!-- 우측: 정보 및 분석 패널 -->
        <div class="info-panel">
            
            <!-- 위젯 1: 시스템 상태 -->
            <div class="glass-panel widget">
                <div class="widget-header">
                    <span>SYSTEM STATUS</span>
                    <i class="fa-solid fa-server text-xs"></i>
                </div>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted">AI Engine:</span>
                        <select id="activeEngine" class="w-auto py-1 text-xs border-none bg-transparent text-right font-bold text-white" onchange="changeEngine()">
                            <option value="gemini">Gemini Core</option>
                            <option value="deepseek">DeepSeek Core</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted">Op Mode:</span>
                        <select id="appMode" class="w-auto py-1 text-xs border-none bg-transparent text-right font-bold text-white">
                            <option value="tutor">TUTOR (회화)</option>
                            <option value="translate">TRANSLATE (번역)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 위젯 2: 분석/설명 (족집게 과외 영역) -->
            <div class="glass-panel widget flex-1 flex flex-col">
                <div class="widget-header">
                    <span>ANALYSIS MODULE</span>
                    <i class="fa-solid fa-microchip text-xs"></i>
                </div>
                <div id="explanationArea" class="flex-1 overflow-y-auto text-sm text-gray-300">
                    <div class="text-center text-gray-600 mt-10 font-tech">
                        <i class="fa-solid fa-radar fa-spin text-2xl mb-2 opacity-50"></i><br>
                        WAITING FOR TARGET SENTENCE...<br>
                        <span class="text-xs">(대화 후 하단 타겟 버튼을 클릭하세요)</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 모달 설정창 (오버레이) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-[rgba(0,0,0,0.8)] backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="glass-panel w-full max-w-md p-6 border-neon">
            <div class="widget-header mb-4">
                <span>CONFIGURATION</span>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-tech text-neon mb-1">GEMINI API KEY</label>
                    <input type="password" id="geminiKeyInput" placeholder="Enter Key...">
                </div>
                <div>
                    <label class="block text-xs font-tech text-neon mb-1">DEEPSEEK API KEY</label>
                    <input type="password" id="deepseekKeyInput" placeholder="Enter Key...">
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-tech text-neon mb-1">VOICE MODULE</label>
                        <div class="flex bg-[rgba(0,0,0,0.4)] rounded border border-[rgba(0,243,255,0.2)]">
                            <button id="genderFemaleBtn" class="flex-1 py-1.5 text-xs bg-[rgba(0,243,255,0.2)] text-neon" onclick="selectGender('female')">TYPE-F</button>
                            <button id="genderMaleBtn" class="flex-1 py-1.5 text-xs text-gray-400" onclick="selectGender('male')">TYPE-M</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-tech text-neon mb-1">FONT SCALE (<span id="fontSizeVal">15px</span>)</label>
                        <input type="range" id="fontSizeSlider" min="12" max="20" value="15" oninput="updateFontSize(this.value)">
                    </div>
                </div>
                <div class="pt-4 border-t border-[rgba(0,243,255,0.2)] flex justify-end">
                    <button class="bg-[rgba(0,243,255,0.2)] text-neon border border-neon px-6 py-2 rounded text-sm font-tech font-bold hover:bg-[rgba(0,243,255,0.4)] transition" onclick="saveSettings()">APPLY CHANGES</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let isListening = false, isSpeaking = false, recognition = null;
        const synthesis = window.speechSynthesis;
        let currentUtterance = null, conversationHistory = [];
        let userInputLanguage = 'ko'; 
        
        // Settings
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let chatFontSize = parseInt(localStorage.getItem('chat_font_size')) || 15;
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';

        // DOM
        const micBtn = document.getElementById('micBtn'), micIcon = document.getElementById('micIcon'), statusText = document.getElementById('statusText');
        const chatContainer = document.getElementById('chatContainer'), avatarImage = document.getElementById('avatarImage');
        const targetLanguageSelect = document.getElementById('targetLanguage'), stopAudioBtn = document.getElementById('stopAudioBtn');
        const activeEngineSelect = document.getElementById('activeEngine');
        const inputLangKo = document.getElementById('inputLangKo'), inputLangTarget = document.getElementById('inputLangTarget');

        // Init UI
        activeEngineSelect.value = selectedEngine;
        document.documentElement.style.setProperty('--chat-font-size', chatFontSize + 'px');
        updateGenderUI(currentVoiceGender);

        function updateFontSize(val) {
            chatFontSize = val; document.getElementById('fontSizeVal').textContent = val + 'px';
            document.documentElement.style.setProperty('--chat-font-size', val + 'px');
        }

        function setInputLanguage(mode) {
            userInputLanguage = mode;
            if (mode === 'ko') {
                inputLangKo.className = "px-3 py-1.5 bg-[rgba(0,243,255,0.2)] text-neon";
                inputLangTarget.className = "px-3 py-1.5 text-gray-400 hover:text-white";
                if (recognition) recognition.lang = 'ko-KR';
            } else {
                inputLangKo.className = "px-3 py-1.5 text-gray-400 hover:text-white";
                inputLangTarget.className = "px-3 py-1.5 bg-[rgba(0,243,255,0.2)] text-neon";
                if (recognition) recognition.lang = targetLanguageSelect.value;
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false; recognition.interimResults = false;
                recognition.lang = userInputLanguage === 'ko' ? 'ko-KR' : targetLanguageSelect.value;

                recognition.onstart = () => {
                    isListening = true; micBtn.classList.add('listening');
                    micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    statusText.innerText = "[ LISTENING... ]"; stopSpeaking(); 
                };
                recognition.onresult = (e) => handleUserMessage(e.results[0][0].transcript);
                recognition.onerror = () => { statusText.innerText = "[ ERROR ]"; resetMicButton(); };
                recognition.onend = () => { isListening = false; resetMicButton(); };
            } else {
                statusText.innerText = "[ STT UNAVAILABLE ]";
            }
        }
        initSpeechRecognition();

        function changeLanguage() {
            setInputLanguage(userInputLanguage); conversationHistory = [];
            statusText.innerText = `[ LANG: ${targetLanguageSelect.value} ]`;
            chatContainer.innerHTML = `<div class="chat-bubble chat-ai"><p class="font-tech text-neon mb-1 text-xs">SYS_MSG</p><p class="dynamic-text">Language updated to ${targetLanguageSelect.value}.</p></div>`;
            stopSpeaking();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            document.getElementById('geminiKeyInput').value = geminiApiKey;
            document.getElementById('deepseekKeyInput').value = deepseekApiKey;
            document.getElementById('fontSizeSlider').value = chatFontSize;
            modal.classList.toggle('hidden');
        }

        function selectGender(gender) {
            currentVoiceGender = gender; updateGenderUI(gender);
        }

        function updateGenderUI(gender) {
            const fBtn = document.getElementById('genderFemaleBtn'), mBtn = document.getElementById('genderMaleBtn');
            if (gender === 'female') {
                fBtn.className = "flex-1 py-1.5 text-xs bg-[rgba(0,243,255,0.2)] text-neon"; mBtn.className = "flex-1 py-1.5 text-xs text-gray-400";
                avatarImage.src = "호두 꿀벌_2.jpg";
            } else {
                mBtn.className = "flex-1 py-1.5 text-xs bg-[rgba(0,243,255,0.2)] text-neon"; fBtn.className = "flex-1 py-1.5 text-xs text-gray-400";
                avatarImage.src = "치타 팔짱_2.jpg";
            }
        }

        function saveSettings() {
            geminiApiKey = document.getElementById('geminiKeyInput').value.trim();
            deepseekApiKey = document.getElementById('deepseekKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey); localStorage.setItem('deepseek_api_key', deepseekApiKey);
            localStorage.setItem('chat_font_size', chatFontSize); localStorage.setItem('voice_gender', currentVoiceGender);
            toggleSettingsModal(); statusText.innerText = "[ CONFIG SAVED ]";
        }

        function changeEngine() { selectedEngine = activeEngineSelect.value; localStorage.setItem('active_engine', selectedEngine); conversationHistory = []; }
        function resetMicButton() { micBtn.classList.remove('listening'); micIcon.classList.replace('fa-ear-listen', 'fa-microphone'); if(!isSpeaking) statusText.innerText = "[ STANDBY ]"; }
        
        function toggleListening() {
            if (!recognition) return;
            if (isListening) recognition.stop();
            else { recognition.lang = userInputLanguage === 'ko' ? 'ko-KR' : targetLanguageSelect.value; recognition.start(); }
        }

        function addMessageToChat(sender, text, translation = null) {
            const div = document.createElement('div');
            div.className = `chat-bubble ${sender === 'user' ? 'chat-user' : 'chat-ai'} group`;
            
            let html = `<p class="dynamic-text">${text}</p>`;
            if (sender === 'ai') {
                const escaped = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                html = `
                    <button onclick="speakText('${escaped}', '${targetLanguageSelect.value}')" class="absolute top-2 right-2 text-[rgba(0,243,255,0.5)] hover:text-neon hidden group-hover:block transition"><i class="fa-solid fa-volume-high text-xs"></i></button>
                    <p class="font-tech text-neon mb-1 text-xs">AI_RESPONSE</p>
                    <p class="dynamic-text pr-6">${text}</p>
                    ${translation ? `<div class="translation-text">${translation}</div>` : ''}
                `;
            } else {
                html = `<p class="font-tech text-gray-400 mb-1 text-xs text-right">USER_INPUT</p><p class="dynamic-text">${text}</p>`;
            }
            div.innerHTML = html; chatContainer.appendChild(div); chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function fetchWithRetry(url, options) {
            try { return await fetch(url, options); } catch (e) { throw e; }
        }

        async function handleUserMessage(text) {
            const mode = document.getElementById('appMode').value;
            addMessageToChat('user', text);
            statusText.innerText = "[ PROCESSING... ]";
            
            if (!geminiApiKey && !deepseekApiKey) { statusText.innerText = "[ API KEY REQUIRED ]"; return; }

            const langName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].dataset.langName;
            let foreignText = "", koreanText = "";

            if (mode === 'translate') {
                 // 번역 모드 간이 프롬프트
                 const p = `Translate this to ${langName}. Return ONLY JSON: {"foreign_text":"translated text", "korean_translation":""}`;
                 foreignText = "Translation Mode Executed."; // 실제 API 연동 시 교체
            } else {
                // 튜터 모드
                const sysPrompt = `Act as a ${langName} tutor. User spoke in ${userInputLanguage === 'ko'?'Korean':'Target'}. Reply in ${langName}. Fix errors. Output ONLY JSON: {"foreign_text":"Reply in target language", "korean_translation":"Korean translation & tip"}`;
                
                try {
                    if (selectedEngine === 'gemini') {
                        conversationHistory.push({ role: "user", parts: [{ text }] });
                        if(conversationHistory.length>10) conversationHistory.shift();
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                            method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({contents: conversationHistory, systemInstruction:{parts:[{text:sysPrompt}]}, generationConfig:{responseMimeType:"application/json"}})
                        });
                        const data = await res.json();
                        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                        foreignText = parsed.foreign_text; koreanText = parsed.korean_translation;
                        conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(parsed) }] });
                    } else {
                        // DeepSeek 로직
                    }
                } catch(e) { console.error(e); statusText.innerText = "[ API ERROR ]"; return; }
            }
            if(foreignText) { addMessageToChat('ai', foreignText, koreanText); speakText(foreignText, targetLanguageSelect.value); }
        }

        function speakText(text, langCode) {
            if (!synthesis) return; stopSpeaking();
            currentUtterance = new SpeechSynthesisUtterance(text); currentUtterance.lang = langCode;
            currentUtterance.pitch = currentVoiceGender === 'female' ? 1.2 : 0.7; currentUtterance.rate = 0.9;
            currentUtterance.onstart = () => { isSpeaking = true; avatarImage.classList.add('speaking-pulse'); stopAudioBtn.disabled = false; stopAudioBtn.classList.add('text-neon'); statusText.innerText = "[ SPEAKING ]"; };
            currentUtterance.onend = () => { isSpeaking = false; avatarImage.classList.remove('speaking-pulse'); stopAudioBtn.disabled = true; stopAudioBtn.classList.remove('text-neon'); statusText.innerText = "[ STANDBY ]"; };
            synthesis.speak(currentUtterance);
        }

        function stopSpeaking() { if (synthesis.speaking) synthesis.cancel(); }

        async function requestExplanation() {
            if(conversationHistory.length===0) return;
            statusText.innerText = "[ ANALYZING... ]";
            const expArea = document.getElementById('explanationArea');
            expArea.innerHTML = `<div class="text-center mt-10"><i class="fa-solid fa-circle-notch fa-spin text-neon text-2xl mb-2"></i><br>EXTRACTING GRAMMAR DATA...</div>`;
            
            // 시뮬레이션 응답 (실제 구현 시 API 요청 코드로 대체)
            setTimeout(() => {
                expArea.innerHTML = `
                    <div class="bg-[rgba(0,243,255,0.1)] border border-[rgba(0,243,255,0.3)] p-4 rounded-lg">
                        <h4 class="text-neon font-tech mb-2"><i class="fa-solid fa-bolt"></i> SYNTAX HIGHLIGHT</h4>
                        <p class="leading-relaxed">This is a simulated explanation panel. In full implementation, the LLM will provide grammar breakdowns here.</p>
                    </div>`;
                statusText.innerText = "[ ANALYSIS COMPLETE ]";
            }, 1000);
        }
    </script>
