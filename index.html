<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --chat-font-size: 14px; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-text-dynamic { font-size: var(--chat-font-size); line-height: 1.5; }
        
        .avatar-container { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid #3b82f6; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); position: relative; margin: 0 auto; transition: border-color 0.3s ease; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        .speaking-pulse { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .speaking-bob { animation: bob 0.5s infinite alternate ease-in-out; }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .listening-animation { animation: bounce 1s infinite alternate; color: #ef4444; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 안전한 버튼 눌림 효과 (기능 충돌 방지) */
        .btn-active-safe:active { transform: scale(0.95); transition: transform 0.1s; }
    </style>
</head>
<body class="p-0 sm:p-4">

    <!-- 모바일 최적화: 높이를 h-full로 꽉 채우고 flex 컬럼으로 배치 -->
    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold tracking-tight">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200 opacity-90">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg p-2 outline-none border border-blue-500 shadow-inner cursor-pointer" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                    <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                    <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                </select>
                <button class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center border border-blue-500 shadow-md btn-active-safe" onclick="toggleSettingsModal(true)">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>

        <div class="flex-none bg-slate-100 px-4 py-2 flex justify-between items-center border-b border-gray-200 text-xs shadow-inner">
            <span class="text-gray-500 font-medium">AI 엔진:</span>
            <select id="activeEngine" class="bg-white border border-gray-300 rounded shadow-sm px-2 py-1 font-bold text-gray-700 outline-none cursor-pointer" onchange="changeEngine()">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek</option>
            </select>
        </div>

        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-4 pb-3 flex flex-col items-center justify-center border-b border-gray-100 z-10">
            <div id="avatarWrap" class="avatar-container mb-2">
                <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=AI+Tutor'">
            </div>
            <div id="statusText" class="text-[11px] font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">준비 완료. 마이크를 탭하세요.</div>
        </div>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar">
            <div class="flex flex-col space-y-1">
                <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-sm self-start" id="welcomeMessage">
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1">안녕하세요! 글로벌 AI 튜터입니다.</p>
                    <div class="mt-2 text-xs text-blue-600 font-semibold bg-blue-50 p-2 rounded">
                        <i class="fa-solid fa-lightbulb"></i> 하단의 '?' 단추를 누르면 방금 대화에 대한 <b>족집게 설명</b>을 들을 수 있어요!
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 sm:pb-4 px-4 flex flex-col z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="flex justify-center mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 w-full max-w-[300px] shadow-inner">
                    <select id="appMode" class="w-full bg-transparent text-xs font-bold text-gray-700 text-center py-2 outline-none cursor-pointer" onchange="changeAppMode()">
                        <option value="tutor">🎓 원어민 튜터 모드</option>
                        <option value="translate">🌐 즉시 번역 모드</option>
                    </select>
                </div>
            </div>

            <div id="sttToggleContainer" class="flex justify-center mb-4 transition-opacity duration-300">
                <div class="bg-white p-1 rounded-full flex items-center border border-gray-200 shadow-sm">
                    <span class="text-[10px] text-gray-500 font-bold px-2">🎙️ 입력 모드:</span>
                    <select id="sttInputLanguage" class="bg-blue-50 text-xs font-bold text-blue-600 rounded-full px-3 py-1 outline-none cursor-pointer">
                        <option value="target">목표 언어로 말하기 (연습)</option>
                        <option value="ko-KR">한국어로 말하기 (번역/질문)</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6">
                <button id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 border border-gray-200 shadow-md flex items-center justify-center btn-active-safe" onclick="stopSpeaking()" disabled><i class="fa-solid fa-volume-xmark"></i></button>
                <button id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl hover:bg-blue-700 shadow-lg shadow-blue-500/40 btn-active-safe" onclick="toggleListening()"><i id="micIcon" class="fa-solid fa-microphone"></i></button>
                <button id="explainBtn" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100 hover:bg-indigo-100 shadow-md flex items-center justify-center btn-active-safe" onclick="requestExplanation()"><i class="fa-solid fa-circle-question"></i></button>
            </div>
        </div>

        <!-- 통합 설정 모달 -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-5 shadow-2xl relative transition-all duration-300 max-h-[95%] overflow-y-auto no-scrollbar">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">⚙️ 상세 설정</h3>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-language text-green-500"></i> 해설 기능(과외) 언어</label>
                    <select id="explainLanguage" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none cursor-pointer">
                        <option value="ko-KR">🇰🇷 한국어로 설명 듣기</option>
                        <option value="target">🌐 목표 언어(외국어)로 설명 듣기</option>
                    </select>
                    <p class="text-[10px] text-gray-500 mt-1">* '?' 버튼을 눌렀을 때 나올 해설의 언어를 결정합니다.</p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-text-height text-blue-500"></i> 채팅 글자 크기</label>
                    <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="14" class="w-full accent-blue-600" oninput="previewFontSize(this.value)">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-person-half-dress text-purple-500"></i> AI 튜터 성별</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="genderFemaleBtn" class="flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors" onclick="selectGender('female')">👩 여성 (호두)</button>
                        <button id="genderMaleBtn" class="flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors" onclick="selectGender('male')">👨 남성 (치타)</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-key text-yellow-500"></i> API 키 등록</label>
                    <div class="space-y-2">
                        <input type="password" id="geminiKeyInput" placeholder="Gemini API Key..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none shadow-inner">
                        <input type="password" id="deepseekKeyInput" placeholder="DeepSeek API Key..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none shadow-inner">
                    </div>
                </div>

                <div class="flex gap-2 mt-5 pt-4 border-t">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm shadow-sm btn-active-safe" onclick="toggleSettingsModal(false)">취소</button>
                    <button class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-md btn-active-safe" onclick="saveSettings()">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isListening = false, isSpeaking = false;
        let recognition = null, currentUtterance = null;
        let synthesis = window.speechSynthesis;
        let conversationHistory = []; 
        let availableVoices = [];

        // Load Settings
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let currentFontSize = localStorage.getItem('chat_font_size') || '14';
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';
        let explainLangPref = localStorage.getItem('explain_lang') || 'ko-KR';

        const micBtn = document.getElementById('micBtn'), micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText'), chatContainer = document.getElementById('chatContainer');
        const avatarWrap = document.getElementById('avatarWrap'), avatarImage = document.getElementById('avatarImage');
        const stopAudioBtn = document.getElementById('stopAudioBtn');

        // Apply UI initial states
        document.getElementById('activeEngine').value = selectedEngine;
        document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);
        updateGenderUI(currentVoiceGender, true);

        synthesis.onvoiceschanged = () => { availableVoices = synthesis.getVoices(); };

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false; recognition.interimResults = false;
                
                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.replace('bg-blue-600', 'bg-red-500');
                    micIcon.classList.add('listening-animation');
                    micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    updateStatus("듣는 중...");
                    stopSpeaking(); 
                };
                recognition.onresult = (e) => handleUserMessage(e.results[0][0].transcript);
                recognition.onerror = (e) => {
                    if (e.error === 'no-speech') updateStatus("음성 미감지");
                    else updateStatus("마이크 에러. 재시도 필요");
                    resetMicButton();
                };
                recognition.onend = () => { isListening = false; resetMicButton(); };
            } else {
                updateStatus("🚨 현 브라우저에서 마이크 비지원");
                micBtn.disabled = true; micBtn.classList.add('opacity-50');
            }
        }
        initSpeechRecognition();

        function changeAppMode() {
            const mode = document.getElementById('appMode').value;
            const toggleContainer = document.getElementById('sttToggleContainer');
            const explainBtn = document.getElementById('explainBtn');
            conversationHistory = [];
            
            if(mode === 'translate') {
                toggleContainer.classList.add('opacity-40', 'pointer-events-none');
                document.getElementById('sttInputLanguage').value = 'ko-KR'; 
                explainBtn.disabled = true; explainBtn.classList.add('opacity-50');
                updateStatus("번역 모드: 한국어로 말씀하세요.");
            } else {
                toggleContainer.classList.remove('opacity-40', 'pointer-events-none');
                explainBtn.disabled = false; explainBtn.classList.remove('opacity-50');
                changeLanguage(); 
            }
        }

        function toggleListening() {
            if (!recognition) return;
            if (isListening) recognition.stop();
            else {
                const mode = document.getElementById('appMode').value;
                const sttMode = document.getElementById('sttInputLanguage').value;
                recognition.lang = (mode === 'translate' || sttMode === 'ko-KR') ? 'ko-KR' : document.getElementById('targetLanguage').value;
                recognition.start();
            }
        }

        // Settings Modal & Logic
        let tempGender = currentVoiceGender;
        function toggleSettingsModal(show) {
            const modal = document.getElementById('settingsModal');
            if(show) {
                document.getElementById('geminiKeyInput').value = geminiApiKey;
                document.getElementById('deepseekKeyInput').value = deepseekApiKey;
                document.getElementById('fontSizeSlider').value = currentFontSize;
                document.getElementById('explainLanguage').value = explainLangPref;
                updateGenderUI(currentVoiceGender, false);
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);
            }
        }

        function previewFontSize(size) { document.documentElement.style.setProperty('--chat-font-size', `${size}px`); }
        function selectGender(gender) { tempGender = gender; updateGenderUI(gender, false); }
        function updateGenderUI(gender, applyImage = false) {
            const fBtn = document.getElementById('genderFemaleBtn'), mBtn = document.getElementById('genderMaleBtn');
            if (gender === 'female') {
                fBtn.className = "flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 border border-blue-100";
                mBtn.className = "flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 border border-transparent";
                if(applyImage) avatarImage.src = "호두 꿀벌_2.jpg";
            } else {
                mBtn.className = "flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 border border-blue-100";
                fBtn.className = "flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 border border-transparent";
                if(applyImage) avatarImage.src = "치타 팔짱_2.jpg";
            }
        }

        function saveSettings() {
            geminiApiKey = document.getElementById('geminiKeyInput').value.trim();
            deepseekApiKey = document.getElementById('deepseekKeyInput').value.trim();
            currentFontSize = document.getElementById('fontSizeSlider').value;
            explainLangPref = document.getElementById('explainLanguage').value;
            currentVoiceGender = tempGender;

            localStorage.setItem('gemini_api_key', geminiApiKey);
            localStorage.setItem('deepseek_api_key', deepseekApiKey);
            localStorage.setItem('chat_font_size', currentFontSize);
            localStorage.setItem('explain_lang', explainLangPref);
            localStorage.setItem('voice_gender', currentVoiceGender);

            updateGenderUI(currentVoiceGender, true);
            toggleSettingsModal(false);
            updateStatus("설정 적용 완료");
        }

        function changeEngine() {
            selectedEngine = document.getElementById('activeEngine').value;
            localStorage.setItem('active_engine', selectedEngine);
            conversationHistory = []; updateStatus(`엔진 변경됨`);
        }

        function changeLanguage() {
            if(document.getElementById('appMode').value === 'translate') return; 
            conversationHistory = [];
            updateStatus("언어 전환됨");
            stopSpeaking();
        }

        function resetMicButton() {
            micBtn.classList.replace('bg-red-500', 'bg-blue-600');
            micIcon.classList.remove('listening-animation');
            micIcon.classList.replace('fa-ear-listen', 'fa-microphone');
            if(!isSpeaking) updateStatus("대기 중");
        }
        function updateStatus(text) { statusText.textContent = text; }

        function playSavedAudio(btnElem) {
            const text = btnElem.getAttribute('data-speak-text');
            const lang = btnElem.getAttribute('data-lang-code');
            if(text && lang) speakText(text, lang);
        }

        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex flex-col space-y-1 mt-4";
            let bubble = '';

            if (sender === 'user') {
                bubble = `<div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] shadow-md self-end"><p class="chat-text-dynamic">${text}</p></div>`;
            } else {
                const escaped = text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                const transHtml = translation ? `<p class="text-xs text-gray-500 mt-2 border-t pt-2 border-gray-100">${translation}</p>` : '';
                const replayBtn = targetLangCode ? `<button onclick="playSavedAudio(this)" data-speak-text="${escaped}" data-lang-code="${targetLangCode}" class="ml-2 text-blue-400 hover:text-blue-600 w-6 h-6 flex shrink-0 items-center justify-center rounded-full bg-blue-50 hover:bg-blue-100 btn-active-safe shadow-inner"><i class="fa-solid fa-volume-high text-[10px]"></i></button>` : '';

                bubble = `
                    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-md self-start">
                        <div class="flex items-start justify-between gap-2"><p class="chat-text-dynamic font-medium text-gray-800 break-words">${text}</p>${replayBtn}</div>
                        ${transHtml}
                    </div>`;
            }
            msgDiv.innerHTML = bubble; chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        async function fetchAPI(url, options) {
            const res = await fetch(url, options);
            if (!res.ok) throw new Error("API Error");
            return res.json();
        }

        async function handleUserMessage(text) {
            addMessageToChat('user', text);
            if (selectedEngine === 'gemini' && !geminiApiKey) return toggleSettingsModal(true);
            if (selectedEngine === 'deepseek' && !deepseekApiKey) return toggleSettingsModal(true);

            updateStatus("분석 중..."); avatarWrap.style.borderColor = "#9ca3af";

            const langSelect = document.getElementById('targetLanguage');
            const targetLangCode = langSelect.value;
            const targetLangName = langSelect.options[langSelect.selectedIndex].getAttribute('data-lang-name');
            const appMode = document.getElementById('appMode').value;
            
            let sysPrompt = "";
            if (appMode === 'translate') {
                sysPrompt = `한국어를 ${targetLangName}로 완벽히 번역해. JSON 포맷: {"foreign_text": "번역문장", "korean_translation": ""}`;
            } else {
                sysPrompt = `너는 친절한 ${targetLangName} 튜터야. 사용자가 한국어로 말하면 번역/답변을, 외국어로 말하면 원어민 대화를 이어가. JSON: {"foreign_text":"오직 ${targetLangName}로 작성된 대답", "korean_translation":"한글 해석/교정"}`;
            }

            try {
                let foreign = "", korean = "";
                if (selectedEngine === 'gemini') {
                    let ctx = (appMode === 'translate') ? [] : conversationHistory;
                    ctx.push({ role: "user", parts: [{ text }] });
                    if(ctx.length > 8) ctx.shift();

                    const data = await fetchAPI(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: ctx, systemInstruction: {parts: [{text: sysPrompt}]}, generationConfig: {responseMimeType: "application/json"} })
                    });
                    const res = JSON.parse(data.candidates[0].content.parts[0].text);
                    foreign = res.foreign_text; korean = res.korean_translation;
                    if(appMode === 'tutor') conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(res) }] });

                } else {
                    let ctx = (appMode === 'translate') ? [{role:"system", content:sysPrompt}, {role:"user", content:text}] : conversationHistory;
                    if(appMode==='tutor' && ctx.length===0) ctx.push({role:"system", content:sysPrompt});
                    if(appMode==='tutor') ctx.push({role:"user", content:text});
                    
                    const data = await fetchAPI("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}`},
                        body: JSON.stringify({ model: "deepseek-chat", messages: ctx, response_format: {type: "json_object"} })
                    });
                    const res = JSON.parse(data.choices[0].message.content);
                    foreign = res.foreign_text; korean = res.korean_translation;
                    if(appMode === 'tutor') conversationHistory.push({ role: "assistant", content: JSON.stringify(res) });
                }

                if(foreign) {
                    addMessageToChat('ai', foreign, korean, targetLangCode);
                    speakText(foreign, targetLangCode);
                }
            } catch(e) {
                updateStatus("오류 발생"); avatarWrap.style.borderColor = "#ef4444";
            }
        }

        function speakText(text, langCode) {
            if (!synthesis) return;
            stopSpeaking(); 
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = langCode; 
            
            let lv = availableVoices.filter(v => v.lang.includes(langCode) || v.lang.replace('-','_') === langCode.replace('-','_'));
            if (lv.length > 0) {
                const isFemale = (currentVoiceGender === 'female');
                let match = lv.find(v => {
                    const n = v.name.toLowerCase();
                    return isFemale ? (n.includes('female')||n.includes('woman')||n.includes('girl')) : (n.includes('male')||n.includes('man')||n.includes('boy'));
                });
                if (!match) match = isFemale ? lv[0] : lv[lv.length-1];
                currentUtterance.voice = match;
            }
            currentUtterance.pitch = currentVoiceGender === 'female' ? 1.2 : 0.7;

            currentUtterance.onstart = () => {
                isSpeaking = true; updateStatus("말하는 중...");
                avatarWrap.classList.add('speaking-pulse', 'speaking-bob');
                avatarWrap.style.borderColor = "#3b82f6"; 
                stopAudioBtn.disabled = false; stopAudioBtn.classList.replace('text-gray-500', 'text-red-500');
            };
            currentUtterance.onend = () => {
                isSpeaking = false; updateStatus("대기 중");
                avatarWrap.classList.remove('speaking-pulse', 'speaking-bob');
                stopAudioBtn.disabled = true; stopAudioBtn.classList.replace('text-red-500', 'text-gray-500');
            };
            synthesis.speak(currentUtterance);
        }

        function stopSpeaking() {
            if (synthesis) synthesis.cancel();
            avatarWrap.classList.remove('speaking-pulse', 'speaking-bob');
        }

        // NEW: Explanation logic with Target Language support
        async function requestExplanation() {
            if (document.getElementById('appMode').value === 'translate') return updateStatus("번역 모드에선 해설 불가");
            if (conversationHistory.length === 0) return;
            if (!geminiApiKey && !deepseekApiKey) return;
            
            updateStatus("해설 생성 중...");
            let lastAi = "";
            try {
                const item = conversationHistory.filter(h => h.role === 'model' || h.role === 'assistant').pop();
                lastAi = JSON.parse(item.parts ? item.parts[0].text : item.content).foreign_text;
            } catch(e){}
            if(!lastAi) return;

            // 해설 언어 설정 적용 로직
            const explainTarget = explainLangPref === 'target' ? document.getElementById('targetLanguage').options[document.getElementById('targetLanguage').selectedIndex].getAttribute('data-lang-name') : '한국어';
            const prompt = `문장 "${lastAi}" 에 쓰인 핵심 문법이나 단어를 과외하듯 ${explainTarget}로 설명해줘.`;
            
            try {
                let exp = "";
                if (selectedEngine === 'gemini') {
                    const data = await fetchAPI(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{role:"user", parts:[{text:prompt}]}] })
                    });
                    exp = data.candidates[0].content.parts[0].text;
                } else {
                    const data = await fetchAPI("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}`},
                        body: JSON.stringify({ model: "deepseek-chat", messages: [{role:"user", content:prompt}] })
                    });
                    exp = data.choices[0].message.content;
                }

                if (exp) {
                    const div = document.createElement('div');
                    div.className = "flex flex-col space-y-1 mt-4";
                    div.innerHTML = `<div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 shadow-md"><p class="text-[11px] font-bold text-indigo-800 mb-1"><i class="fa-solid fa-graduation-cap"></i> 튜터의 맞춤 해설 (${explainTarget})</p><p class="chat-text-dynamic text-gray-800">${exp.replace(/\n/g, '<br>')}</p></div>`;
                    chatContainer.appendChild(div);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    updateStatus("대기 중");
                }
            } catch(e) { updateStatus("해설 실패"); }
        }
    </script>
</body>
