<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --chat-font-size: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-text-dynamic {
            font-size: var(--chat-font-size);
            line-height: 1.5;
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #3b82f6;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            position: relative;
            margin: 0 auto;
            transition: border-color 0.3s ease;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .speaking-pulse {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .speaking-bob {
            animation: bob 0.5s infinite alternate ease-in-out;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .listening-animation {
            animation: bounce 1s infinite alternate;
            color: #ef4444; 
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 단어 선택 효과 클래스 */
        .word-selected {
            background-color: #fde047; /* yellow-300 */
            color: #000;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-0 sm:p-4" onclick="clearWordSelection()">

    <!-- App Container -->
    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative" onclick="event.stopPropagation()">
        
        <!-- Header -->
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg focus:ring-blue-500 border border-blue-500 p-2 outline-none cursor-pointer" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                    <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                    <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                </select>
                <button id="settingsBtn" class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center transition-colors border border-blue-500 shadow-sm" onclick="toggleSettingsModal(true)">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Engine Indicator Strip -->
        <div class="flex-none bg-slate-100 px-4 py-2 flex justify-between items-center border-b border-gray-200 text-xs">
            <span class="text-gray-500 font-medium">사용 중인 AI 엔진:</span>
            <select id="activeEngine" class="bg-white border border-gray-300 rounded px-2 py-1 font-bold text-gray-700 outline-none cursor-pointer shadow-sm" onchange="changeEngine()">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek (딥시크)</option>
            </select>
        </div>

        <!-- Visual Area / Avatar -->
        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-4 pb-3 flex flex-col items-center justify-center relative border-b border-gray-100 shadow-sm z-10" onclick="clearWordSelection()">
            <div id="avatarWrap" class="avatar-container mb-2 transition-all duration-300">
                <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=AI+Tutor'">
            </div>
            <div id="statusText" class="text-xs font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">
                준비됨. 하단 마이크를 눌러 대화를 시작하세요.
            </div>
        </div>

        <!-- Chat / Subtitles Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar pb-6" onclick="clearWordSelection()">
            <!-- System Welcome Message -->
            <div class="flex flex-col space-y-1">
                <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-sm self-start" id="welcomeMessage">
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1">안녕하세요! 저는 당신의 AI 튜터입니다.</p>
                    <div class="mt-2 text-xs text-blue-600 font-semibold bg-blue-50 p-2 rounded leading-relaxed">
                        <i class="fa-solid fa-circle-info"></i> 원어민 튜터 모드로 대화하거나 즉시 번역 모드를 사용할 수 있습니다.<br>
                        💡 <b>단어를 터치(클릭)</b>해서 구간을 선택한 후 💡나 ? 버튼을 누르면 그 단어만 과외해 줍니다!
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 sm:pb-4 px-4 flex flex-col z-20" onclick="clearWordSelection()">
            
            <!-- App Mode & Level Selector Row -->
            <div class="flex justify-center gap-2 mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 flex-1 max-w-[150px] shadow-sm">
                    <select id="appMode" class="w-full bg-transparent text-xs font-bold text-gray-700 text-center py-2 outline-none cursor-pointer" onchange="changeAppMode()">
                        <option value="tutor">🎓 튜터 모드</option>
                        <option value="translate">🌐 번역 통역기</option>
                    </select>
                </div>
                <div id="levelContainer" class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 flex-1 max-w-[150px] shadow-sm transition-opacity duration-300">
                    <select id="proficiencyLevel" class="w-full bg-transparent text-xs font-bold text-blue-600 text-center py-2 outline-none cursor-pointer" onchange="changeLevel()">
                        <option value="beginner">🌱 초급 (Beginner)</option>
                        <option value="intermediate">🌿 중급 (Inter)</option>
                        <option value="advanced">🌳 고급 (Advanced)</option>
                        <option value="native">🔥 원어민 (Native)</option>
                    </select>
                </div>
            </div>

            <!-- Full STT Input Language Selector -->
            <div id="sttToggleContainer" class="flex justify-center mb-3 transition-opacity duration-300">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 shadow-sm">
                    <span class="text-[10px] text-gray-500 font-bold px-2">🗣️ 내 음성 언어:</span>
                    <select id="sttInputLanguage" class="bg-white text-xs font-bold text-blue-600 rounded-full px-3 py-1 outline-none shadow-sm cursor-pointer border border-gray-200" onchange="updateStatus('입력 언어가 변경되었습니다.')">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6">
                <button id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="stopSpeaking()" disabled>
                    <i class="fa-solid fa-volume-xmark text-lg"></i>
                </button>
                <button id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl hover:bg-blue-700 transition-transform transform hover:scale-105 shadow-lg shadow-blue-500/50 outline-none" onclick="toggleListening()">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>
                <button id="explainBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="requestGlobalExplanation(event)">
                    <i class="fa-solid fa-circle-question text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm" onclick="toggleSettingsModal(false)">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-5 shadow-2xl relative transition-all duration-300 max-h-[95%] overflow-y-auto no-scrollbar" onclick="event.stopPropagation()">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">⚙️ 앱 상세 설정</h3>
                
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-text-height text-blue-500"></i> 채팅 글자 크기</label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500">작게</span>
                        <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="14" class="w-full accent-blue-600" oninput="previewFontSize(this.value)">
                        <span class="text-lg text-gray-500">크게</span>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-person-half-dress text-purple-500"></i> AI 목소리 성별</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="genderFemaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors" onclick="selectGender('female')">👩 여성 </button>
                        <button id="genderMaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors" onclick="selectGender('male')">👨 남성 </button>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-language text-green-500"></i> 과외 해설 언어 (설명용)</label>
                    <select id="explanationLanguage" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none bg-gray-50 shadow-sm cursor-pointer">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어로 해설 듣기</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어로 해설 듣기</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어로 해설 듣기</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어로 해설 듣기</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어로 해설 듣기</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어로 해설 듣기</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어로 해설 듣기</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-key text-yellow-500"></i> API 키 설정</label>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Google Gemini API Key</label>
                            <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">DeepSeek API Key</label>
                            <input type="password" id="deepseekKeyInput" placeholder="sk-..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-6 pt-4 border-t border-gray-100">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm" onclick="toggleSettingsModal(false)">취소</button>
                    <button class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm" onclick="saveSettings()">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let currentUtterance = null;
        let conversationHistory = []; 
        let speechQueue = []; 
        let isProcessingQueue = false;
        
        // Custom Selection State Variables
        let selMsgId = null;
        let selStartIdx = null;
        let selEndIdx = null;
        
        // Settings
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let currentFontSize = localStorage.getItem('chat_font_size') || '14';
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';
        let currentExpLanguage = localStorage.getItem('explanation_language') || 'ko-KR';
        let currentLevel = localStorage.getItem('proficiency_level') || 'intermediate';

        // DOM
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText');
        const chatContainer = document.getElementById('chatContainer');
        const avatarWrap = document.getElementById('avatarWrap');
        const avatarImage = document.getElementById('avatarImage');
        const targetLanguageSelect = document.getElementById('targetLanguage');
        const sttInputLanguageSelect = document.getElementById('sttInputLanguage');
        const explanationLanguageSelect = document.getElementById('explanationLanguage');
        const stopAudioBtn = document.getElementById('stopAudioBtn');
        const appModeSelect = document.getElementById('appMode');
        const levelSelect = document.getElementById('proficiencyLevel');

        // Init UI
        document.getElementById('activeEngine').value = selectedEngine;
        document.getElementById('fontSizeSlider').value = currentFontSize;
        document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);
        explanationLanguageSelect.value = currentExpLanguage;
        levelSelect.value = currentLevel;
        updateGenderUI(currentVoiceGender, true); 

        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => { availableVoices = window.speechSynthesis.getVoices(); };

        // --- TTS & Text Cleaners ---
        function cleanTextForTTS(rawText) {
            if (!rawText) return "";
            let cleaned = rawText.replace(/[\*\#\`\~\"\'\(\)\[\]\<\>\{\}\_\-\:\;]/g, ' ');
            cleaned = cleaned.replace(/[\u{1F600}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned.replace(/\.{2,}/g, '.').replace(/\!{2,}/g, '!').replace(/\?{2,}/g, '?');
        }

        // --- Smart Click-to-Select Logic ---
        function handleWordClick(event, elem) {
            event.stopPropagation(); // Prevent document click from clearing
            
            const msgId = elem.getAttribute('data-msgid');
            const idx = parseInt(elem.getAttribute('data-index'));

            // If clicking a different message, reset selection
            if (selMsgId !== msgId) {
                clearWordSelection();
                selMsgId = msgId;
                selStartIdx = idx;
                selEndIdx = null;
            } else {
                // Same message.
                if (selStartIdx !== null && selEndIdx === null) {
                    selEndIdx = idx;
                    if (selStartIdx > selEndIdx) {
                        let temp = selStartIdx;
                        selStartIdx = selEndIdx;
                        selEndIdx = temp;
                    }
                } else {
                    // Reset and start new
                    clearWordSelection();
                    selMsgId = msgId;
                    selStartIdx = idx;
                }
            }
            renderWordSelection();
        }

        function renderWordSelection() {
            // Clear all visual selections
            document.querySelectorAll('.word-clickable').forEach(el => el.classList.remove('word-selected'));
            
            if (selMsgId && selStartIdx !== null) {
                const end = selEndIdx !== null ? selEndIdx : selStartIdx;
                for (let i = selStartIdx; i <= end; i++) {
                    const el = document.querySelector(`.word-clickable[data-msgid="${selMsgId}"][data-index="${i}"]`);
                    if (el) el.classList.add('word-selected');
                }
            }
        }

        function clearWordSelection() {
            selMsgId = null;
            selStartIdx = null;
            selEndIdx = null;
            renderWordSelection();
        }

        function getSelectedText() {
            if (!selMsgId || selStartIdx === null) return "";
            const end = selEndIdx !== null ? selEndIdx : selStartIdx;
            let textParts = [];
            for (let i = selStartIdx; i <= end; i++) {
                const el = document.querySelector(`.word-clickable[data-msgid="${selMsgId}"][data-index="${i}"]`);
                if (el) textParts.push(el.innerText);
            }
            return textParts.join(" ");
        }

        function wrapTextWithClickableSpans(text, msgId) {
            // 시각적 방해를 막기 위해 마크다운 기호를 우선 제거 후 단어 단위로 쪼갬
            let cleanText = text.replace(/\*\*(.*?)\*\*/g, '$1'); 
            let tokens = cleanText.split(/([ \n\t]+)/);
            let wrapped = "";
            let idx = 0;
            for(let t of tokens) {
                if(t.trim() === "") {
                    wrapped += t;
                } else {
                    wrapped += `<span class="word-clickable cursor-pointer hover:bg-blue-100 transition-colors px-0.5 rounded" data-msgid="${msgId}" data-index="${idx}" onclick="handleWordClick(event, this)">${t}</span>`;
                    idx++;
                }
            }
            return wrapped;
        }


        // --- App Modes ---
        function changeAppMode() {
            conversationHistory = []; 
            if(appModeSelect.value === 'translate') {
                levelSelect.parentElement.classList.add('opacity-30', 'pointer-events-none'); 
                updateStatus("번역 모드: 마이크를 눌러 말하세요.");
                document.getElementById('welcomeMessage').innerHTML = `
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1"><b>🌐 즉시 번역 모드</b>가 켜졌습니다.</p>
                `;
            } else {
                levelSelect.parentElement.classList.remove('opacity-30', 'pointer-events-none');
                changeLanguage(); 
            }
        }

        function changeLevel() {
            currentLevel = levelSelect.value;
            localStorage.setItem('proficiency_level', currentLevel);
            conversationHistory = []; 
            changeLanguage();
        }

        // --- STT ---
        function initSpeechRecognition() {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false; 
                recognition.interimResults = false; 

                recognition.onstart = function() {
                    isListening = true;
                    micBtn.classList.replace('bg-blue-600', 'bg-red-500');
                    micIcon.classList.add('listening-animation');
                    micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    updateStatus("듣는 중...");
                    stopSpeaking(); 
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    handleUserMessage(transcript);
                };

                recognition.onerror = function(event) {
                    if (event.error === 'no-speech') updateStatus("음성이 인식되지 않았습니다.");
                    else updateStatus("마이크 오류 발생.");
                    resetMicButton();
                };

                recognition.onend = function() {
                    isListening = false;
                    resetMicButton();
                };
            } else {
                updateStatus("🚨 음성인식이 지원되지 않는 브라우저입니다.");
                micBtn.disabled = true;
                micBtn.classList.add('opacity-50');
            }
        }
        initSpeechRecognition();

        function toggleListening() {
            if (!recognition) return;
            if (isListening) recognition.stop();
            else {
                try { recognition.lang = sttInputLanguageSelect.value; recognition.start(); } catch(e) {}
            }
        }

        // --- Settings ---
        function toggleSettingsModal(show = true) {
            const modal = document.getElementById('settingsModal');
            if(show) {
                document.getElementById('geminiKeyInput').value = geminiApiKey;
                document.getElementById('deepseekKeyInput').value = deepseekApiKey;
                document.getElementById('fontSizeSlider').value = currentFontSize;
                explanationLanguageSelect.value = currentExpLanguage;
                updateGenderUI(currentVoiceGender, false);
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function previewFontSize(size) { document.documentElement.style.setProperty('--chat-font-size', `${size}px`); }
        
        let tempGender = currentVoiceGender;
        function selectGender(gender) { tempGender = gender; updateGenderUI(gender, false); }

        function updateGenderUI(gender, applyImage = false) {
            const fBtn = document.getElementById('genderFemaleBtn');
            const mBtn = document.getElementById('genderMaleBtn');
            if (gender === 'female') {
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors border border-blue-200";
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors border border-transparent";
                if(applyImage) avatarImage.src = "호두 꿀벌_2.jpg";
            } else {
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors border border-blue-200";
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors border border-transparent";
                if(applyImage) avatarImage.src = "치타 팔짱_2.jpg";
            }
        }

        function saveSettings() {
            geminiApiKey = document.getElementById('geminiKeyInput').value.trim();
            deepseekApiKey = document.getElementById('deepseekKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey);
            localStorage.setItem('deepseek_api_key', deepseekApiKey);
            
            currentFontSize = document.getElementById('fontSizeSlider').value;
            localStorage.setItem('chat_font_size', currentFontSize);
            document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);

            currentExpLanguage = explanationLanguageSelect.value;
            localStorage.setItem('explanation_language', currentExpLanguage);

            currentVoiceGender = tempGender;
            localStorage.setItem('voice_gender', currentVoiceGender);
            updateGenderUI(currentVoiceGender, true);

            toggleSettingsModal(false);
            updateStatus("설정이 저장되었습니다.");
        }

        function changeEngine() {
            selectedEngine = document.getElementById('activeEngine').value;
            localStorage.setItem('active_engine', selectedEngine);
            conversationHistory = []; 
        }

        function changeLanguage() {
            conversationHistory = [];
            const langName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            sttInputLanguageSelect.value = targetLanguageSelect.value;
            document.getElementById('welcomeMessage').innerHTML = `<p class="chat-text-dynamic text-gray-800 font-medium mb-1"><b>${langName}</b> 튜터 모드 활성화됨.</p>`;
            stopSpeaking();
        }

        function resetMicButton() {
            micBtn.classList.replace('bg-red-500', 'bg-blue-600');
            micIcon.classList.remove('listening-animation');
            micIcon.classList.replace('fa-ear-listen', 'fa-microphone');
            if(!isSpeaking) updateStatus("대기 중");
        }
        function updateStatus(text) { statusText.textContent = text; }

        // --- Chat Render ---
        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex flex-col space-y-1 mt-4 fade-in";
            let msgId = 'msg_' + Date.now() + Math.floor(Math.random()*1000);
            
            let bubbleHtml = '';

            if (sender === 'user') {
                bubbleHtml = `<div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] shadow-md self-end"><p class="chat-text-dynamic">${text}</p></div>`;
            } else if (sender === 'ai') {
                const escapedForDataAttr = text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                let translationHtml = translation ? `<p class="text-xs text-gray-500 mt-2 border-t pt-2 border-gray-100">${translation}</p>` : '';
                
                // 적용: 스마트 단어 쪼개기 래핑
                const clickableTextHtml = wrapTextWithClickableSpans(text, msgId);

                let replayBtnHtml = targetLangCode ? `
                    <div class="flex gap-1 ml-2 shrink-0">
                        <button onclick="requestSpecificExplanation(event, this)" data-explain-text="${escapedForDataAttr}" data-msgid="${msgId}" class="text-green-500 hover:text-green-700 transition-colors w-7 h-7 flex items-center justify-center rounded-full hover:bg-green-50 shadow-sm border border-green-100 bg-white" title="이 문장 과외 듣기">
                            <i class="fa-solid fa-lightbulb text-sm"></i>
                        </button>
                        <button onclick="playSavedAudio(event, this)" data-speak-text="${escapedForDataAttr}" data-lang-code="${targetLangCode}" class="text-blue-400 hover:text-blue-600 transition-colors w-7 h-7 flex items-center justify-center rounded-full hover:bg-blue-50 shadow-sm border border-blue-100 bg-white" title="다시 듣기">
                            <i class="fa-solid fa-volume-high text-sm"></i>
                        </button>
                    </div>
                ` : '';

                bubbleHtml = `
                    <div class="ai-bubble-content bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-md self-start" data-raw-text="${escapedForDataAttr}">
                        <div class="flex items-start justify-between gap-2">
                            <p class="chat-text-dynamic font-medium text-gray-800 break-words leading-relaxed tracking-wide">${clickableTextHtml}</p>
                            ${replayBtnHtml}
                        </div>
                        ${translationHtml}
                    </div>
                `;
            }

            msgDiv.innerHTML = bubbleHtml;
            chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        // --- Interaction ---
        function playSavedAudio(event, btnElem) {
            event.stopPropagation();
            const text = btnElem.getAttribute('data-speak-text');
            const lang = btnElem.getAttribute('data-lang-code');
            if (text) speakMixedText(text, lang, targetLanguageSelect.value);
        }

        async function fetchWithRetry(url, options) {
            for (let i = 0; i < 3; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.ok) return res;
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2,i)));
                } catch (e) { if(i===2) throw e; }
            }
        }

        // --- LLM ---
        async function handleUserMessage(text) {
            addMessageToChat('user', text);
            if ((selectedEngine === 'gemini' && !geminiApiKey) || (selectedEngine === 'deepseek' && !deepseekApiKey)) return toggleSettingsModal(true);

            updateStatus("생각하는 중...");
            avatarWrap.style.borderColor = "#9ca3af"; 

            const selectedLangCode = targetLanguageSelect.value;
            const selectedLangName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            const inputLangName = sttInputLanguageSelect.options[sttInputLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            const expLangName = explanationLanguageSelect.options[explanationLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            
            let sysPrompt = "";
            if (appModeSelect.value === 'translate') {
                sysPrompt = `입력된 [${inputLangName}] 문장을 [${selectedLangName}]로 완벽하게 번역하세요. 결과는 반드시 JSON 형식으로 { "foreign_text": "번역된 문장", "korean_translation": "" } 로 출력하세요.`;
            } else {
                sysPrompt = `당신은 '${selectedLangName}' 튜터입니다. 사용자가 '${selectedLangName}'로 말했다면 자연스러운 원어민 답변을, '${inputLangName}'로 말했다면 분석 및 대화 유도를 하세요. 해설 및 팁 부분은 반드시 [${expLangName}]로 작성하세요. 출력은 무조건 JSON 형식 { "foreign_text": "${selectedLangName} 텍스트", "korean_translation": "해당 문장의 ${expLangName} 해석 및 교정 팁" } 이어야 합니다.`;
            }

            try {
                let fText = "", kText = "";
                if (selectedEngine === 'gemini') {
                    let ctx = (appModeSelect.value === 'translate') ? [] : conversationHistory;
                    ctx.push({ role: "user", parts: [{ text: text }] });
                    if(ctx.length > 8) ctx.shift();
                    const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: ctx, systemInstruction: { parts: [{ text: sysPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    const data = await res.json();
                    const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                    fText = parsed.foreign_text; kText = parsed.korean_translation;
                    if(appModeSelect.value === 'tutor') conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(parsed) }] });
                } else {
                    let ctx = [{ role: "system", content: sysPrompt }, { role: "user", content: text }];
                    const res = await fetchWithRetry("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: ctx, response_format: { type: "json_object" } })
                    });
                    const data = await res.json();
                    const parsed = JSON.parse(data.choices[0].message.content);
                    fText = parsed.foreign_text; kText = parsed.korean_translation;
                    if(appModeSelect.value === 'tutor') conversationHistory.push({ role: "assistant", content: JSON.stringify(parsed) });
                }

                if (fText) {
                    addMessageToChat('ai', fText, kText, selectedLangCode);
                    speakMixedText(fText, selectedLangCode, targetLanguageSelect.value);
                }
            } catch (e) {
                updateStatus("API 오류 발생.");
                avatarWrap.style.borderColor = "#ef4444"; 
            }
        }

        // --- TTS Execution ---
        function getMatchedVoice(langCode) {
            const baseLang = langCode.split('-')[0].toLowerCase();
            let voices = availableVoices.filter(v => v.lang.toLowerCase().startsWith(baseLang));
            if (voices.length > 0) {
                const isF = (currentVoiceGender === 'female');
                let matched = voices.find(v => {
                    const n = v.name.toLowerCase();
                    return isF ? (n.includes('female')||n.includes('woman')||n.includes('girl')) : (n.includes('male')||n.includes('man')||n.includes('boy'));
                });
                if(!matched) matched = voices.find(v => v.name.includes('Google')) || voices[0];
                return matched;
            }
            return null;
        }

        function speakMixedText(text, baseLangCode, targetLangCode) {
            if (!synthesis) return;
            stopSpeaking();
            const cleaned = cleanTextForTTS(text);
            if(!cleaned) return;

            const regex = /([a-zA-ZÀ-ỹĐđ]+[\s\d\.\,\!\?\'\"]*)|([^a-zA-ZÀ-ỹĐđ]+)/g;
            let parts = []; let match;
            const bGrp = baseLangCode.substring(0,2), tGrp = targetLangCode.substring(0,2);
            const latins = ['en','es','vi']; 

            while ((match = regex.exec(cleaned)) !== null) {
                if(match[1] && match[1].trim()!=='') {
                    let lang = baseLangCode;
                    if(latins.includes(tGrp) && !latins.includes(bGrp)) lang = targetLangCode;
                    else if(!latins.includes(tGrp) && !latins.includes(bGrp)) lang = 'en-US';
                    parts.push({text: match[1].trim(), lang});
                }
                if(match[2] && match[2].trim()!=='') {
                    let lang = baseLangCode, asian = match[2].trim();
                    if (/[\uAC00-\uD7A3]/.test(asian)) lang = 'ko-KR';
                    else if (/[\u3040-\u30FF]/.test(asian)) lang = 'ja-JP';
                    else if (/[\u0E00-\u0E7F]/.test(asian)) lang = 'th-TH';
                    else if (/[\u4E00-\u9FFF]/.test(asian)) lang = (tGrp==='zh'||bGrp==='zh')?'zh-CN':'ja-JP';
                    else if(!latins.includes(tGrp) && latins.includes(bGrp)) lang = targetLangCode;
                    parts.push({text: asian, lang});
                }
            }
            if(parts.length>0) { speechQueue = parts; return processSpeechQueue(); }
            processSpeechQueue([{text: cleaned, lang: baseLangCode}]);
        }

        function processSpeechQueue() {
            if (speechQueue.length === 0) return stopSpeakingUI();
            let chunk = speechQueue.shift();
            currentUtterance = new SpeechSynthesisUtterance(chunk.text);
            currentUtterance.lang = chunk.lang;
            const v = getMatchedVoice(chunk.lang);
            if(v) currentUtterance.voice = v;
            currentUtterance.rate = 0.95; currentUtterance.pitch = currentVoiceGender==='female'?1.1:0.8;
            currentUtterance.onstart = () => { isSpeaking = true; avatarWrap.classList.add('speaking-pulse','speaking-bob'); stopAudioBtn.disabled = false; stopAudioBtn.classList.replace('text-gray-600','text-red-500'); };
            currentUtterance.onend = () => processSpeechQueue();
            currentUtterance.onerror = () => stopSpeakingUI();
            synthesis.speak(currentUtterance);
        }

        function stopSpeakingUI() {
            isSpeaking = false; speechQueue = [];
            avatarWrap.classList.remove('speaking-pulse','speaking-bob');
            stopAudioBtn.disabled = true; stopAudioBtn.classList.replace('text-red-500','text-gray-600');
        }
        function stopSpeaking() { if (synthesis) { synthesis.cancel(); stopSpeakingUI(); } }

        // --- Explanation Request (Global & Specific) ---
        function requestGlobalExplanation(event) {
            event.stopPropagation();
            let textToExplain = getSelectedText();
            let mode = 'word';

            if (!textToExplain) {
                const bubbles = document.querySelectorAll('.ai-bubble-content');
                if(bubbles.length > 0) {
                    textToExplain = bubbles[bubbles.length - 1].getAttribute('data-raw-text');
                    mode = 'sentence';
                }
            }
            if(!textToExplain) return updateStatus("설명할 문장이 없습니다.");
            executeExplanation(textToExplain, mode);
        }

        function requestSpecificExplanation(event, btnElem) {
            event.stopPropagation();
            const fullText = btnElem.getAttribute('data-explain-text');
            const msgId = btnElem.getAttribute('data-msgid');
            
            let textToExplain = fullText;
            let mode = 'sentence';

            // 만약 사용자가 이 특정 말풍선 안의 단어를 선택해 놓은 상태라면
            if (selMsgId === msgId && selStartIdx !== null) {
                const selected = getSelectedText();
                if(selected) {
                    textToExplain = selected;
                    mode = 'word';
                }
            }
            executeExplanation(textToExplain, mode);
        }

        async function executeExplanation(targetText, mode) {
            if ((selectedEngine === 'gemini' && !geminiApiKey) || (selectedEngine === 'deepseek' && !deepseekApiKey)) return;
            updateStatus("해설 분석 중...");
            clearWordSelection(); // 설명 요청 후 선택 초기화

            const expLangCode = explanationLanguageSelect.value;
            const expLangName = explanationLanguageSelect.options[explanationLanguageSelect.selectedIndex].getAttribute('data-lang-name');

            let prompt = "";
            if (mode === 'word') {
                prompt = `방금 대화에서 사용자가 다음 특정 구간을 선택했습니다: "${targetText}". 이 표현의 뜻과 쓰임새를 반드시 [${expLangName}] 언어로 아주 짧고 친절하게 해설해줘. 설명 중간에 이 단어를 활용한 짧은 예문도 하나 넣어줘.`;
            } else {
                prompt = `방금 대화 문장 ("${targetText}") 전체에 대해 다음 두 가지를 반드시 [${expLangName}] 언어로 제공해줘: 1. 문장의 자연스러운 번역. 2. 이 문장에 쓰인 핵심 문법이나 단어 1~2개에 대한 상세한 해설.`;
            }

            try {
                let explanation = "";
                if (selectedEngine === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    explanation = data.candidates[0].content.parts[0].text;
                } else {
                    const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` }, body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                    });
                    const data = await res.json();
                    explanation = data.choices[0].message.content;
                }

                if (explanation) {
                    let visualText = explanation.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    const escaped = explanation.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                    const titleIcon = mode === 'word' ? '<i class="fa-solid fa-magnifying-glass"></i> 선택 구간 집중 해설' : '<i class="fa-solid fa-lightbulb"></i> 문장 전체 해설';

                    const msgDiv = document.createElement('div');
                    msgDiv.className = "flex flex-col space-y-1 mt-4 fade-in";
                    msgDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 w-full shadow-md relative" onclick="event.stopPropagation()">
                            <button onclick="playSavedAudio(event, this)" data-speak-text="${escaped}" data-lang-code="${expLangCode}" data-mixed-lang="true" class="absolute top-3 right-3 text-yellow-600 hover:text-yellow-800 bg-yellow-100 hover:bg-yellow-200 w-7 h-7 flex shrink-0 items-center justify-center rounded-full transition-colors shadow-sm">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                            <p class="text-xs font-bold text-yellow-800 mb-2">${titleIcon} (${expLangName})</p>
                            <div class="bg-white/60 px-3 py-2 rounded-lg mb-3 border border-yellow-100">
                                <p class="text-[10px] text-gray-500 font-semibold mb-0.5">질문 대상:</p>
                                <p class="text-sm font-bold text-gray-800">"${targetText}"</p>
                            </div>
                            <p class="chat-text-dynamic text-gray-800 pr-6 leading-relaxed">${visualText}</p>
                        </div>
                    `;
                    chatContainer.appendChild(msgDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    updateStatus("대기 중");
                }
            } catch (e) { updateStatus("설명 불러오기 실패"); }
        }
    </script>
