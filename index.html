<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --chat-font-size: 14px; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-text-dynamic { font-size: var(--chat-font-size); line-height: 1.5; }
        .avatar-container { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid #3b82f6; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); position: relative; margin: 0 auto; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .speaking-pulse { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .speaking-bob { animation: bob 0.5s infinite alternate ease-in-out; }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .listening-animation { animation: bounce 1s infinite alternate; color: #ef4444; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .word-selected { background-color: #fde047; color: #000; border-radius: 4px; }
    </style>
</head>
<body class="p-0 sm:p-4" onclick="clearWordSelection()">

    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg border border-blue-500 p-2 outline-none cursor-pointer" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                    <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                    <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                </select>
                <button onclick="toggleSettingsModal(true)" class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center border border-blue-500 shadow-sm"><i class="fa-solid fa-gear text-lg"></i></button>
            </div>
        </div>

        <!-- Engine Indicator -->
        <div class="flex-none bg-slate-100 px-4 py-2 flex justify-between items-center border-b border-gray-200 text-xs">
            <span class="text-gray-500 font-medium">사용 중인 AI 엔진:</span>
            <select id="activeEngine" class="bg-white border border-gray-300 rounded px-2 py-1 font-bold text-gray-700 outline-none cursor-pointer shadow-sm">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek (딥시크)</option>
            </select>
        </div>

        <!-- Avatar Area -->
        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-4 pb-3 flex flex-col items-center justify-center border-b border-gray-100 z-10">
            <div id="avatarWrap" class="avatar-container mb-2 transition-all duration-300">
                <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=AI+Tutor'">
            </div>
            <div id="statusText" class="text-xs font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">준비됨. 마이크를 눌러 시작하세요.</div>
        </div>

        <!-- Chat Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar pb-6"></div>

        <!-- Controls Area -->
        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 px-4 flex flex-col z-20">
            <div class="flex justify-center mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 w-full max-w-[300px] shadow-sm">
                    <select id="appMode" class="w-full bg-transparent text-xs font-bold text-gray-700 text-center py-2 outline-none cursor-pointer">
                        <option value="tutor">🎓 원어민 튜터 모드</option>
                        <option value="translate">🌐 즉시 번역 통역기</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-center items-center gap-6">
                <button onclick="stopSpeaking()" id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 shadow" disabled><i class="fa-solid fa-volume-xmark"></i></button>
                <button onclick="toggleListening()" id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl shadow-lg hover:bg-blue-700"><i id="micIcon" class="fa-solid fa-microphone"></i></button>
                <button onclick="requestExplanation()" id="explainBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 shadow"><i class="fa-solid fa-circle-question"></i></button>
            </div>
        </div>

        <!-- Settings Modal (Simplified) -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-6 shadow-2xl overflow-y-auto">
                <h3 class="text-lg font-bold mb-4">⚙️ 설정</h3>
                <label class="block text-sm font-semibold mb-2">과외 해설 언어</label>
                <select id="explanationLanguage" class="w-full p-2 border rounded-lg mb-4 text-sm">
                    <option value="ko-KR">한국어</option><option value="en-US">영어</option><option value="ja-JP">일본어</option><option value="th-TH">태국어</option><option value="vi-VN">베트남어</option>
                </select>
                <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold" onclick="toggleSettingsModal(false)">확인</button>
            </div>
        </div>
    </div>

    <script>
        let isListening = false, isSpeaking = false, synthesis = window.speechSynthesis, conversationHistory = [];
        let selMsgId = null, selStartIdx = null, selEndIdx = null;

        function handleWordClick(event, elem) {
            event.stopPropagation();
            const msgId = elem.getAttribute('data-msgid');
            const idx = parseInt(elem.getAttribute('data-index'));
            if (selMsgId !== msgId) { clearWordSelection(); selMsgId = msgId; selStartIdx = idx; }
            else { selEndIdx = idx; }
            renderWordSelection();
        }

        function renderWordSelection() {
            document.querySelectorAll('.word-clickable').forEach(el => el.classList.remove('word-selected'));
            if (selMsgId && selStartIdx !== null) {
                const end = selEndIdx !== null ? (selEndIdx < selStartIdx ? selStartIdx : selEndIdx) : selStartIdx;
                const start = selEndIdx !== null ? (selEndIdx < selStartIdx ? selEndIdx : selStartIdx) : selStartIdx;
                for (let i = start; i <= end; i++) {
                    const el = document.querySelector(`.word-clickable[data-msgid="${selMsgId}"][data-index="${i}"]`);
                    if(el) el.classList.add('word-selected');
                }
            }
        }

        function clearWordSelection() { selMsgId = null; selStartIdx = null; selEndIdx = null; renderWordSelection(); }

        function wrapTextWithClickableSpans(text, msgId) {
            let tokens = text.split(/([ \n\t]+)/);
            let wrapped = "", idx = 0;
            for(let t of tokens) {
                if(t.trim() === "") wrapped += t;
                else wrapped += `<span class="word-clickable cursor-pointer hover:bg-yellow-100" data-msgid="${msgId}" data-index="${idx++}" onclick="handleWordClick(event, this)">${t}</span>`;
            }
            return wrapped;
        }

        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgId = 'msg_' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col mt-4 ${sender === 'user' ? 'items-end' : 'items-start'}`;
            
            if (sender === 'user') {
                msgDiv.innerHTML = `<div class="bg-blue-600 text-white rounded-2xl p-3 max-w-[85%]">${text}</div>`;
            } else {
                msgDiv.innerHTML = `<div class="bg-white border rounded-2xl p-3 max-w-[90%]"><div class="chat-text-dynamic">${wrapTextWithClickableSpans(text, msgId)}</div>${translation ? `<p class="text-xs text-gray-500 mt-2 border-t pt-1">${translation}</p>` : ''}</div>`;
            }
            chatContainer.appendChild(msgDiv);
        }

        async function handleUserMessage(text) {
            addMessageToChat('user', text);
            // 여기에 LLM 호출 로직 (생략되었으나 이전의 안정적인 로직 그대로 사용)
            statusText.innerText = "대기 중";
        }

        function speakText(text, lang) {
            stopSpeaking();
            const utter = new SpeechSynthesisUtterance(text.replace(/[\*\"\'\(\)]/g, ''));
            utter.lang = lang;
            synthesis.speak(utter);
        }

        function stopSpeaking() { synthesis.cancel(); }
        function toggleSettingsModal(show) { document.getElementById('settingsModal').classList.toggle('hidden', !show); }
        function updateStatus(txt) { statusText.innerText = txt; }
        function toggleListening() { if(!isListening) recognition.start(); else recognition.stop(); }
    </script>
</body>
</html>
