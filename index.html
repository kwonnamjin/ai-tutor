<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --chat-font-size: 14px; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-text-dynamic { font-size: var(--chat-font-size); line-height: 1.5; }
        
        .avatar-container { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid #3b82f6; position: relative; margin: 0 auto; background: white; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        
        .speaking-pulse { animation: pulse-ring 1.25s infinite; }
        .speaking-bob { animation: bob 0.6s infinite alternate; }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        @keyframes bob {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-8px) scale(1.05); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-0 sm:p-4">

    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg p-2 outline-none border border-blue-500" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                </select>
                <button class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center transition-colors" onclick="toggleSettingsModal()">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>

        <!-- Avatar Area -->
        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-6 pb-4 flex flex-col items-center justify-center border-b border-gray-100 z-10">
            <div id="avatarWrap" class="avatar-container mb-3 transition-all duration-300">
                <img src="호두 꿀벌.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=Avatar'">
            </div>
            <div id="statusText" class="text-xs font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">
                대화 준비됨
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar"></div>

        <!-- Controls -->
        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 px-4 flex flex-col z-20">
            <div class="flex justify-center mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200">
                    <span class="text-[10px] text-gray-500 font-bold px-2">🗣️ 내 음성 인식:</span>
                    <select id="sttInputLanguage" class="bg-white text-xs font-bold text-blue-600 rounded-full px-3 py-1 outline-none shadow-sm cursor-pointer border border-gray-200">
                        <option value="target">목표 언어</option>
                        <option value="ko-KR">한국어</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-center items-center gap-6">
                <button id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center shadow" onclick="stopSpeaking()" disabled>
                    <i class="fa-solid fa-volume-xmark"></i>
                </button>
                <button id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl shadow-lg transition-transform hover:scale-105" onclick="toggleListening()">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>
                <button class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center shadow" onclick="requestExplanation()">
                    <i class="fa-solid fa-circle-question"></i>
                </button>
            </div>
        </div>

        <!-- Modal -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-5 shadow-2xl">
                <h3 class="text-lg font-bold mb-4">⚙️ 상세 설정</h3>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-2">채팅 글자 크기</label>
                    <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="14" class="w-full accent-blue-600" oninput="previewFontSize(this.value)">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-semibold mb-2">AI 목소리 성별</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="genderFemaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600" onclick="selectGender('female')">👩‍💼 여성 (호두)</button>
                        <button id="genderMaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-500" onclick="selectGender('male')">👨‍💼 남성 (치타)</button>
                    </div>
                </div>
                <button class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold" onclick="saveSettings()">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        const avatarImage = document.getElementById('avatarImage');
        const avatarWrap = document.getElementById('avatarWrap');
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';
        
        function updateAvatar(gender) {
            avatarImage.src = (gender === 'female') ? "호두 꿀벌.jpg" : "치타 팔짱.jpg";
            currentVoiceGender = gender;
            const fBtn = document.getElementById('genderFemaleBtn');
            const mBtn = document.getElementById('genderMaleBtn');
            if (gender === 'female') {
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600";
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200";
            } else {
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600";
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200";
            }
        }
        
        function toggleSettingsModal() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function selectGender(g) { updateAvatar(g); }
        function saveSettings() { localStorage.setItem('voice_gender', currentVoiceGender); toggleSettingsModal(); }
        
        // Initial setup
        updateAvatar(currentVoiceGender);

        // STT/TTS Logic remains same as previous version...
        // [Existing logic for speech recognition, LLM calls, and playback included here in production]
        // Note: For brevity in this response, I've focused on the avatar integration. 
        // Ensure all previous helper functions (handleUserMessage, speakText, etc.) are included in the final file.
        
        function speakText(text, langCode) {
            const synth = window.speechSynthesis;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            
            utterance.onstart = () => {
                avatarWrap.classList.add('speaking-pulse', 'speaking-bob');
                document.getElementById('statusText').textContent = "말하는 중...";
            };
            utterance.onend = () => {
                avatarWrap.classList.remove('speaking-pulse', 'speaking-bob');
                document.getElementById('statusText').textContent = "대기 중";
            };
            synth.speak(utterance);
        }

        // --- All other previous functions (handleUserMessage, toggleListening, etc) would remain here ---
    </script>
</body>
</html>
