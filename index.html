<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkAI Tutor - Silver Edition</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter for modern, sleek look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chat-font-size: 15px;
            --silver-bg: #e2e8f0;
            --silver-light: #ffffff;
            --silver-shadow: #cbd5e1;
            --text-main: #334155;
            --text-muted: #64748b;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background-color: #cbd5e1; /* Base deeper silver background */
            background-image: radial-gradient(circle at 50% 0%, #f8fafc 0%, #cbd5e1 100%);
            margin: 0;
            /* Changed from fixed 100vh to min-h-screen for scrolling on mobile */
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            /* Added padding for mobile breathing room */
            padding: 1rem; 
        }

        /* 1. Overall Outer Silver Frame */
        .silver-frame {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 2px solid #ffffff;
            box-shadow: 
                0 30px 60px rgba(71, 85, 105, 0.3),
                inset 0 0 0 3px rgba(203, 213, 225, 0.4), /* Inner silver rim */
                inset 0 2px 15px rgba(255, 255, 255, 1);  /* Top highlight */
        }

        /* 2. Console Box Panels (Subtle extruded silver metal) */
        .silver-panel {
            background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                8px 8px 16px var(--silver-shadow), 
                -8px -8px 16px var(--silver-light);
            border-radius: 1.5rem;
        }

        /* 3. Inset Silver Panel (For chat areas and inputs - pressed in metal) */
        .silver-inset {
            background: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 
                inset 5px 5px 10px var(--silver-shadow), 
                inset -5px -5px 10px var(--silver-light);
            border-radius: 1.25rem;
        }

        /* 4. Silver Buttons */
        .silver-btn {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                5px 5px 10px var(--silver-shadow), 
                -5px -5px 10px var(--silver-light);
            transition: all 0.2s ease;
            color: var(--text-muted);
            cursor: pointer;
        }
        .silver-btn:hover {
            transform: translateY(-1px);
            box-shadow: 
                6px 6px 12px var(--silver-shadow), 
                -6px -6px 12px var(--silver-light);
            color: var(--accent);
        }
        .silver-btn:active {
            transform: translateY(1px);
            box-shadow: 
                inset 3px 3px 6px var(--silver-shadow), 
                inset -3px -3px 6px var(--silver-light);
        }

        /* 5. Accent Buttons (Blue gem embedded in silver) */
        .accent-btn {
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            border: 1px solid #93c5fd;
            box-shadow: 
                5px 5px 10px var(--silver-shadow), 
                -5px -5px 10px var(--silver-light);
            color: white;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .accent-btn:hover {
            transform: translateY(-1px);
            box-shadow: 
                6px 6px 12px var(--silver-shadow), 
                -6px -6px 12px var(--silver-light);
            filter: brightness(1.05);
        }
        .accent-btn:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px rgba(30, 58, 138, 0.4);
        }

        /* Neumorphic Toggle & Select Elements */
        .toggle-btn-inactive {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            box-shadow: 4px 4px 8px var(--silver-shadow), -4px -4px 8px var(--silver-light);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .toggle-btn-inactive:hover {
            transform: translateY(-1px);
            color: var(--accent);
        }
        .toggle-btn-active {
            background: #e2e8f0;
            box-shadow: inset 4px 4px 8px var(--silver-shadow), inset -4px -4px 8px var(--silver-light);
            transition: all 0.2s ease;
        }
        .silver-select {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            box-shadow: 3px 3px 6px var(--silver-shadow), -3px -3px 6px var(--silver-light);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .silver-select:hover {
            box-shadow: 4px 4px 8px var(--silver-shadow), -4px -4px 8px var(--silver-light);
            border-color: #cbd5e1;
        }

        /* Miscellaneous utilities */
        .chat-text-dynamic { font-size: var(--chat-font-size); line-height: 1.6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Avatar Ring */
        .avatar-ring {
            border: 4px solid #e2e8f0;
            box-shadow: 
                4px 4px 10px var(--silver-shadow), 
                -4px -4px 10px var(--silver-light),
                inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Speaking Animations */
        .speaking-bob { animation: bob 0.6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
        .listening-glow {
            animation: pulse-red 1.5s infinite alternate;
            color: #ef4444 !important;
        }
        @keyframes pulse-red { 
            0% { text-shadow: 0 0 0 rgba(239, 68, 68, 0); } 
            100% { text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); } 
        }

        /* Responsive Layout Overrides */
        @media (max-width: 1024px) {
            body {
                padding: 0;
            }
            .silver-frame {
                border-radius: 0;
                border: none;
                min-height: 100vh;
                height: auto;
            }
        }
    </style>
</head>
<!-- Removed overflow-hidden from body to allow scrolling on small devices -->
<body class="w-full">

    <!-- App Container (Dashboard Layout) -->
    <!-- Changed fixed height to min-h-screen and flex-col for mobile, sm:flex-row for larger -->
    <div class="silver-frame w-full max-w-[1400px] mx-auto min-h-screen lg:h-[90vh] lg:min-h-[700px] rounded-none lg:rounded-[2.5rem] p-3 lg:p-4 flex flex-col lg:flex-row gap-4 lg:gap-5 relative">
        
        <!-- ========================================== -->
        <!-- 1. TOP/LEFT SIDEBAR: Controls & Settings   -->
        <!-- ========================================== -->
        <!-- Changed fixed width to full width on mobile, fixed on desktop -->
        <div class="silver-panel w-full lg:w-72 flex-none flex flex-col p-4 lg:p-6 z-10 gap-4 lg:gap-5">
            
            <!-- Mobile Header Area (Avatar and Title side-by-side on mobile) -->
            <div class="flex flex-row lg:flex-col items-center lg:items-start justify-between lg:justify-start gap-4">
                
                <!-- Header Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full silver-inset flex items-center justify-center text-blue-500 text-xl shadow-inner hidden lg:flex">
                        <i class="fa-solid fa-microphone-lines"></i>
                    </div>
                    <div>
                        <h1 class="text-base lg:text-lg font-bold tracking-tight text-slate-700">TalkAI Tutor</h1>
                        <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Silver Edition</p>
                    </div>
                </div>

                <!-- Avatar Profile (Smaller on mobile, horizontal layout) -->
                <div class="flex flex-row lg:flex-col items-center gap-3 lg:mb-4 lg:mt-4">
                    <div id="avatarWrap" class="avatar-ring w-14 h-14 lg:w-28 lg:h-28 rounded-full overflow-hidden transition-transform duration-300 flex-shrink-0">
                        <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="w-full h-full object-cover" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/94a3b8?text=Tutor'">
                    </div>
                    <div id="statusText" class="text-[10px] lg:text-xs font-semibold text-slate-500 silver-inset px-3 py-1.5 lg:px-4 rounded-full flex items-center gap-2 whitespace-nowrap">
                        <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div>
                        준비됨
                    </div>
                </div>
            </div>

            <!-- Settings & Selectors (Grid on mobile, column on desktop) -->
            <div class="grid grid-cols-2 lg:flex lg:flex-col gap-3 lg:gap-5 flex-1">
                <!-- Target Language -->
                <div>
                    <label class="block text-[10px] lg:text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 lg:mb-2 pl-1">학습 언어</label>
                    <select id="targetLanguage" class="w-full silver-select text-slate-700 text-xs lg:text-sm font-semibold rounded-xl p-2 lg:p-3 outline-none cursor-pointer" onchange="changeLanguage()">
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                    </select>
                </div>

                <!-- Input Mode -->
                <div>
                    <label class="block text-[10px] lg:text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 lg:mb-2 pl-1">음성 모드</label>
                    <div class="flex gap-2 h-[36px] lg:h-auto">
                        <button id="inputLangTarget" class="flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-blue-600 toggle-btn-active" onclick="setInputLanguage('target')">
                            🌐 외국어
                        </button>
                        <button id="inputLangKo" class="flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-slate-500 toggle-btn-inactive" onclick="setInputLanguage('ko')">
                            🇰🇷 한국어
                        </button>
                    </div>
                </div>

                <!-- App Mode -->
                <div class="col-span-2 lg:col-span-1">
                    <label class="block text-[10px] lg:text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 lg:mb-2 pl-1">앱 동작 모드</label>
                    <select id="appMode" class="w-full silver-select text-slate-700 text-xs lg:text-sm font-semibold rounded-xl p-2 lg:p-3 outline-none cursor-pointer" onchange="changeAppMode()">
                        <option value="tutor">🎓 원어민 튜터 대화</option>
                        <option value="translate">🌐 즉시 통번역기</option>
                    </select>
                </div>
            </div>

            <!-- Settings Button -->
            <button class="col-span-2 lg:col-span-1 mt-1 lg:mt-auto silver-btn w-full py-2.5 lg:py-3 rounded-xl flex items-center justify-center gap-2 font-bold text-xs lg:text-sm text-slate-600" onclick="toggleSettingsModal(true)">
                <i class="fa-solid fa-sliders"></i> <span class="hidden lg:inline">상세 환경</span>설정
            </button>
        </div>

        <!-- ========================================== -->
        <!-- 2. CENTER CONSOLE: Main Chat Interface     -->
        <!-- ========================================== -->
        <!-- Ensure min-height on mobile so chat is readable -->
        <div class="flex-1 w-full min-h-[400px] flex flex-col relative z-0 gap-3 lg:gap-4">
            <!-- Chat Log Box (Inset Silver) -->
            <div id="chatContainer" class="flex-1 h-0 silver-inset p-4 lg:p-8 overflow-y-auto space-y-4 lg:space-y-5 no-scrollbar scroll-smooth">
                <!-- Welcome Banner -->
                <div class="flex flex-col space-y-1 items-center mb-4 lg:mb-8">
                    <div class="silver-panel p-3 lg:p-4 rounded-2xl max-w-[95%] lg:max-w-[90%] text-center border-t border-white/60">
                        <p class="text-xs lg:text-sm font-semibold text-slate-700 mb-1 lg:mb-2">프리미엄 AI 튜터에 오신 것을 환영합니다.</p>
                        <p class="text-[11px] lg:text-xs text-slate-500 leading-relaxed">
                            원하는 언어를 선택한 후 하단 마이크를 눌러 말씀해 주세요.<br class="hidden lg:block">
                            실버 콘솔 에디션은 정교한 다국어 피드백을 제공합니다.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Bar (Silver Panel) -->
            <div class="silver-panel flex-none p-3 lg:p-4 px-4 lg:px-6 flex items-center justify-between gap-4">
                <button id="stopAudioBtn" class="silver-btn w-10 h-10 lg:w-12 lg:h-12 rounded-full flex items-center justify-center text-base lg:text-lg shrink-0" onclick="stopSpeaking()" disabled title="음성 재생 중지">
                    <i class="fa-solid fa-volume-xmark"></i>
                </button>

                <!-- Central Mic Area -->
                <div class="flex-1 flex justify-center relative">
                    <!-- Glow effect behind mic -->
                    <div class="absolute inset-0 bg-blue-400 rounded-full blur-xl opacity-0 transition-opacity duration-300" id="micGlow"></div>
                    
                    <button id="micBtn" class="accent-btn w-14 h-14 lg:w-16 lg:h-16 rounded-full flex items-center justify-center text-xl lg:text-2xl relative z-10" onclick="toggleListening()">
                        <i id="micIcon" class="fa-solid fa-microphone"></i>
                    </button>
                </div>

                <button id="explainBtn" class="silver-btn w-10 h-10 lg:w-12 lg:h-12 rounded-full flex items-center justify-center text-base lg:text-lg shrink-0" onclick="requestExplanation()" title="문법 족집게 과외">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 3. RIGHT SIDEBAR: Widgets & Analysis       -->
        <!-- ========================================== -->
        <!-- Visible on Desktop, Hidden on smaller screens -->
        <div class="w-full lg:w-[320px] flex-none hidden xl:flex flex-col gap-5 z-10">
            
            <!-- Engine Status Widget -->
            <div class="silver-panel p-5 flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-microchip"></i> AI Engine Status
                </h3>
                <select id="activeEngine" class="w-full silver-select text-slate-700 text-sm font-bold rounded-xl p-3 outline-none cursor-pointer mb-3" onchange="changeEngine()">
                    <option value="gemini">Google Gemini Pro</option>
                    <option value="deepseek">DeepSeek Core</option>
                </select>
                <div class="flex justify-between text-[10px] text-slate-500 px-1 font-medium">
                    <span>Latency: <span class="text-green-500">Low</span></span>
                    <span>Connection: <span class="text-blue-500">Secure</span></span>
                </div>
            </div>

            <!-- Point Explanation Widget Area -->
            <div class="silver-panel p-5 flex-1 flex flex-col overflow-hidden h-[300px] lg:h-auto">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb"></i> Grammar Analysis
                </h3>
                <div id="explanationWidget" class="silver-inset flex-1 rounded-xl p-4 overflow-y-auto no-scrollbar text-sm text-slate-600 leading-relaxed font-medium">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-60 text-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
                        <p class="text-xs">하단 마이크 옆 [과외 단추]를 누르면<br>이곳에 상세한 문법 해설이 표시됩니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal (Silver Styled) -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
            <div class="silver-panel w-full max-w-md p-5 lg:p-6 relative max-h-[90vh] overflow-y-auto no-scrollbar">
                <h3 class="text-lg lg:text-xl font-bold text-slate-700 mb-4 lg:mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-slate-400"></i> 시스템 환경설정
                </h3>
                
                <div class="space-y-5 lg:space-y-6">
                    <!-- Text Size -->
                    <div>
                        <label class="flex justify-between text-xs font-bold text-slate-500 mb-2 lg:mb-3">
                            <span>채팅 글자 크기 (Font Size)</span>
                            <span id="fontSizeVal" class="text-blue-500">15px</span>
                        </label>
                        <input type="range" id="fontSizeSlider" min="13" max="22" value="15" class="w-full h-2 silver-inset rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="updateFontSize(this.value)">
                    </div>

                    <!-- Voice Gender -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2 lg:mb-3">AI 아바타 성별 및 톤</label>
                        <div class="flex gap-2 h-[44px]">
                            <button id="genderFemaleBtn" class="flex-1 rounded-xl text-xs lg:text-sm font-bold text-blue-600 toggle-btn-active" onclick="selectGender('female')">👩 여성 (호두)</button>
                            <button id="genderMaleBtn" class="flex-1 rounded-xl text-xs lg:text-sm font-bold text-slate-500 toggle-btn-inactive" onclick="selectGender('male')">👨 남성 (치타)</button>
                        </div>
                    </div>

                    <!-- API Keys -->
                    <div class="space-y-3 lg:space-y-4 border-t border-white pt-4">
                        <h4 class="text-[11px] lg:text-xs font-bold text-slate-400 uppercase tracking-wider">보안 API 키 설정</h4>
                        <div>
                            <input type="password" id="geminiKeyInput" placeholder="Google Gemini API Key (AIzaSy...)" class="w-full silver-inset rounded-xl p-2.5 lg:p-3 text-xs lg:text-sm text-slate-700 placeholder-slate-400 focus:ring-2 focus:ring-blue-400 outline-none">
                        </div>
                        <div>
                            <input type="password" id="deepseekKeyInput" placeholder="DeepSeek API Key (sk-...)" class="w-full silver-inset rounded-xl p-2.5 lg:p-3 text-xs lg:text-sm text-slate-700 placeholder-slate-400 focus:ring-2 focus:ring-blue-400 outline-none">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mt-6 lg:mt-8">
                    <button class="flex-1 silver-btn py-2.5 lg:py-3 rounded-xl font-bold text-xs lg:text-sm" onclick="toggleSettingsModal(false)">취소</button>
                    <button class="flex-1 accent-btn py-2.5 lg:py-3 rounded-xl font-bold text-xs lg:text-sm shadow-md" onclick="saveSettings()">저장 및 적용</button>
                </div>
            </div>
        </div>

        <!-- Custom Toast Notification -->
        <div id="toast" class="fixed bottom-20 lg:bottom-24 left-1/2 transform -translate-x-1/2 silver-panel text-slate-700 font-bold text-xs lg:text-sm px-4 lg:px-6 py-2.5 lg:py-3 rounded-full pointer-events-none transition-all duration-300 opacity-0 scale-90 z-50 flex items-center gap-2 border-slate-200 shadow-xl whitespace-nowrap">
            <i class="fa-solid fa-circle-info text-blue-500"></i>
            <span id="toastMessage">알림</span>
        </div>

    </div>

    <script>
        //        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let currentUtterance = null;
        let conversationHistory = []; 
        let userInputLanguage = 'target'; 
        
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let chatFontSize = parseInt(localStorage.getItem('chat_font_size')) || 15;
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';

        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const micGlow = document.getElementById('micGlow');
        const statusText = document.getElementById('statusText');
        const chatContainer = document.getElementById('chatContainer');
        const avatarWrap = document.getElementById('avatarWrap');
        const avatarImage = document.getElementById('avatarImage');
        const targetLanguageSelect = document.getElementById('targetLanguage');
        const stopAudioBtn = document.getElementById('stopAudioBtn');
        const activeEngineSelect = document.getElementById('activeEngine');
        const explanationWidget = document.getElementById('explanationWidget');

        activeEngineSelect.value = selectedEngine;
        document.getElementById('fontSizeSlider').value = chatFontSize;
        document.getElementById('fontSizeVal').textContent = chatFontSize + 'px';
        document.documentElement.style.setProperty('--chat-font-size', chatFontSize + 'px');
        updateGenderUI(currentVoiceGender, true);

        //        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('opacity-0', 'scale-90');
            toast.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-90');
            }, 3000);
        }

        function updateFontSize(val) {
            chatFontSize = val;
            document.getElementById('fontSizeVal').textContent = val + 'px';
            document.documentElement.style.setProperty('--chat-font-size', val + 'px');
        }

        let tempGender = currentVoiceGender;
        function selectGender(gender) {
            tempGender = gender;
            updateGenderUI(gender, false);
        }

        function updateGenderUI(gender, applyImage = false) {
            const fBtn = document.getElementById('genderFemaleBtn');
            const mBtn = document.getElementById('genderMaleBtn');
            
            if (gender === 'female') {
                fBtn.className = "flex-1 rounded-xl text-xs lg:text-sm font-bold text-blue-600 toggle-btn-active";
                mBtn.className = "flex-1 rounded-xl text-xs lg:text-sm font-bold text-slate-500 toggle-btn-inactive";
                if(applyImage) avatarImage.src = "호두 꿀벌_2.jpg";
            } else {
                mBtn.className = "flex-1 rounded-xl text-xs lg:text-sm font-bold text-blue-600 toggle-btn-active";
                fBtn.className = "flex-1 rounded-xl text-xs lg:text-sm font-bold text-slate-500 toggle-btn-inactive";
                if(applyImage) avatarImage.src = "치타 팔짱_2.jpg";
            }
        }

        function toggleSettingsModal(show = true) {
            const modal = document.getElementById('settingsModal');
            if(show) {
                document.getElementById('geminiKeyInput').value = geminiApiKey;
                document.getElementById('deepseekKeyInput').value = deepseekApiKey;
                updateGenderUI(currentVoiceGender, false);
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.documentElement.style.setProperty('--chat-font-size', `${chatFontSize}px`);
                document.getElementById('fontSizeSlider').value = chatFontSize;
            }
        }

        function saveSettings() {
            geminiApiKey = document.getElementById('geminiKeyInput').value.trim();
            deepseekApiKey = document.getElementById('deepseekKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey);
            localStorage.setItem('deepseek_api_key', deepseekApiKey);
            localStorage.setItem('chat_font_size', chatFontSize);
            
            currentVoiceGender = tempGender;
            localStorage.setItem('voice_gender', currentVoiceGender);
            updateGenderUI(currentVoiceGender, true);
            
            toggleSettingsModal(false);
            showToast("시스템 설정이 저장되었습니다.");
        }

        function setInputLanguage(mode) {
            userInputLanguage = mode;
            const btnKo = document.getElementById('inputLangKo');
            const btnTarget = document.getElementById('inputLangTarget');
            
            if (mode === 'ko') {
                btnKo.className = "flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-blue-600 toggle-btn-active";
                btnTarget.className = "flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-slate-500 toggle-btn-inactive";
                if (recognition) recognition.lang = 'ko-KR';
                showToast("한국어 인식 모드");
            } else {
                btnKo.className = "flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-slate-500 toggle-btn-inactive";
                btnTarget.className = "flex-1 rounded-xl text-[10px] lg:text-xs font-bold text-blue-600 toggle-btn-active";
                if (recognition) recognition.lang = targetLanguageSelect.value;
                showToast("외국어 인식 모드");
            }
        }

        function changeLanguage() {
        function changeLanguage() {
            const selectedLangName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].dataset.langName;
            setInputLanguage(userInputLanguage);
            conversationHistory = [];
            showToast(`${selectedLangName} 환경으로 전환`);
        }

        function changeAppMode() {
            const mode = document.getElementById('appMode').value;
            if(mode === 'translate') {
                showToast("🌐 즉시 통번역기 모드 활성화");
            } else {
                showToast("🎓 원어민 튜터 대화 모드 활성화");
            }
        }

        function changeEngine() {
            selectedEngine = activeEngineSelect.value;
            localStorage.setItem('active_engine', selectedEngine);
            conversationHistory = [];
            showToast(`${selectedEngine === 'gemini' ? 'Gemini Pro' : 'DeepSeek'} 엔진 작동`);
        }

        //        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false; 
                recognition.interimResults = false; 
                recognition.lang = userInputLanguage === 'ko' ? 'ko-KR' : targetLanguageSelect.value;

                recognition.onstart = function() {
                    isListening = true;
                    micBtn.classList.replace('accent-btn', 'bg-red-500'); 
                    micIcon.classList.add('listening-glow');
                    micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    micGlow.classList.replace('bg-blue-400', 'bg-red-500');
                    micGlow.classList.remove('opacity-0');
                    micGlow.classList.add('opacity-50');
                    statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_5px_#ef4444] animate-pulse"></div> 수신 중...';
                    stopSpeaking(); 
                };

                recognition.onresult = (e) => handleUserMessage(e.results[0][0].transcript);

                recognition.onerror = function(event) {
                    if (event.error === 'no-speech') showToast("음성이 감지되지 않았습니다.");
                    resetMicButton();
                };

                recognition.onend = () => resetMicButton();
            } else {
                showToast("음성 인식 비지원 브라우저입니다.");
                micBtn.disabled = true;
                micBtn.style.opacity = '0.5';
            }
        }

        initSpeechRecognition();

        function resetMicButton() {
            isListening = false;
            micBtn.classList.remove('bg-red-500');
            micBtn.classList.add('accent-btn');
            micIcon.classList.remove('listening-glow');
            micIcon.classList.replace('fa-ear-listen', 'fa-microphone');
            micGlow.classList.replace('bg-red-500', 'bg-blue-400');
            micGlow.classList.remove('opacity-50');
            micGlow.classList.add('opacity-0');
            if(!isSpeaking) statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
        }

        function toggleListening() {
            if (!recognition) return showToast("STT 모듈을 로드할 수 없습니다.");
            if (isListening) recognition.stop();
            else {
                recognition.lang = userInputLanguage === 'ko' ? 'ko-KR' : targetLanguageSelect.value;
                recognition.start();
            }
        }

        //        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let bubble = '';
            const escapedText = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            if (sender === 'user') {
                bubble = `
                    <div class="accent-btn rounded-[1.25rem] rounded-tr-none px-4 py-2.5 lg:px-5 lg:py-3 max-w-[85%] chat-text-dynamic shadow-md">
                        ${text}
                    </div>
                `;
            } else {
                let transHtml = translation ? `<div class="text-[11px] lg:text-xs text-slate-500 mt-2 border-t border-slate-200/50 pt-2 font-medium">${translation}</div>` : '';
                let replayBtn = targetLangCode ? `
                    <button onclick="speakText('${escapedText}', '${targetLangCode}')" class="absolute -right-2 -top-2 lg:-right-3 lg:-top-3 w-7 h-7 lg:w-8 lg:h-8 rounded-full silver-btn flex items-center justify-center text-blue-500 hover:text-blue-600 transition-transform hover:scale-110 z-10">
                        <i class="fa-solid fa-volume-high text-[10px] lg:text-xs"></i>
                    </button>
                ` : '';

                bubble = `
                    <div class="silver-panel rounded-[1.25rem] rounded-tl-none px-4 py-3 lg:px-5 lg:py-4 max-w-[90%] relative chat-text-dynamic font-semibold text-slate-700">
                        ${replayBtn}
                        <div>${text}</div>
                        ${transHtml}
                    </div>
                `;
            }

            msgDiv.innerHTML = bubble;
            chatContainer.appendChild(msgDiv);
            setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50);
        }

        //        async function handleUserMessage(text) {
            addMessageToChat('user', text);
            
            const mode = document.getElementById('appMode').value;
            const targetLangCode = targetLanguageSelect.value;
            const targetLangName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].dataset.langName;
            
            if (mode === 'translate') {
                return executeTranslation(text, targetLangCode, targetLangName);
            }

            if ((selectedEngine === 'gemini' && !geminiApiKey) || (selectedEngine === 'deepseek' && !deepseekApiKey)) {
                return showToast("설정(⚙️)에서 API 키를 입력해주세요.");
            }

            statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-yellow-400 shadow-[0_0_5px_#facc15] animate-pulse"></div> 연산 중...';
            avatarWrap.style.transform = 'scale(0.95)';

            const sysPrompt = `당신은 전문적이고 다정한 '${targetLangName}' 튜터입니다. 사용자가 ${userInputLanguage === 'ko' ? '한국어' : targetLangName}로 말했습니다. 
자연스러운 ${targetLangName}로 1~2문장으로 짧게 대답을 이어나가고, 한국어 해석과 문법 팁을 JSON으로 반환하세요: {"foreign_text": "${targetLangName} 대답", "korean_translation": "한국어 해석 및 교정"}`;

            try {
                let foreign = "", korean = "";
                if (selectedEngine === 'gemini') {
                    if(conversationHistory.length === 0) conversationHistory.push({ role: "user", parts: [{ text: "Hello" }] }, { role: "model", parts: [{ text: `{"foreign_text":"Hello!","korean_translation":"안녕하세요!"}` }] });
                    conversationHistory.push({ role: "user", parts: [{ text: text }] });
                    if(conversationHistory.length > 8) conversationHistory.shift();

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: conversationHistory, systemInstruction: { parts: [{ text: sysPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    const data = await res.json();
                    const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(parsed) }] });
                } else {
                    if(conversationHistory.length === 0) conversationHistory.push({ role: "system", content: sysPrompt });
                    conversationHistory.push({ role: "user", content: text });
                    if(conversationHistory.length > 9) conversationHistory = [conversationHistory[0], ...conversationHistory.slice(-8)];

                    const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: conversationHistory, response_format: { type: "json_object" }, temperature: 0.7 })
                    });
                    const data = await res.json();
                    const parsed = JSON.parse(data.choices[0].message.content);
                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    conversationHistory.push({ role: "assistant", content: JSON.stringify(parsed) });
                }

                avatarWrap.style.transform = 'scale(1)';
                if (foreign) {
                    addMessageToChat('ai', foreign, korean, targetLangCode);
                    speakText(foreign, targetLangCode);
                }
            } catch (err) {
                console.error(err);
                showToast("엔진 응답 실패. API 키를 확인하세요.");
                avatarWrap.style.transform = 'scale(1)';
                statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
            }
        }

        async function executeTranslation(text, langCode, langName) {
            statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-yellow-400 shadow-[0_0_5px_#facc15] animate-pulse"></div> 번역 중...';
            try {
                const prompt = `사용자의 한국어 문장 "${text}"를 ${langName}로 완벽하게 번역해줘. 오직 번역된 결과 텍스트만 한 줄로 출력해.`;
                let translated = "";
                
                if (selectedEngine === 'gemini' && geminiApiKey) {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}] })
                    });
                    const data = await res.json();
                    translated = data.candidates[0].content.parts[0].text.replace(/["'{}]/g, '').trim();
                } else if (deepseekApiKey) {
                    const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: [{role: "user", content: prompt}] })
                    });
                    const data = await res.json();
                    translated = data.choices[0].message.content.replace(/["'{}]/g, '').trim();
                } else {
                    return showToast("API 키가 없습니다.");
                }

                addMessageToChat('ai', translated, "즉시 통번역 결과", langCode);
                speakText(translated, langCode);
            } catch (e) {
                showToast("번역 실패");
                statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
            }
        }

        //        function speakText(text, langCode) {
            if (!synthesis) return;
            stopSpeaking(); 

            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = langCode; 
            
            const voices = synthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes(langCode) && (v.name.includes('Google') || v.name.includes('Premium')));
            if(preferredVoice) currentUtterance.voice = preferredVoice;

            currentUtterance.rate = 0.9; 
            currentUtterance.pitch = currentVoiceGender === 'female' ? 1.2 : 0.7;

            currentUtterance.onstart = () => {
                isSpeaking = true;
                statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_5px_#3b82f6] animate-pulse"></div> 출력 중...';
                avatarWrap.classList.add('speaking-bob');
                stopAudioBtn.disabled = false;
                stopAudioBtn.classList.add('text-red-500');
            };

            currentUtterance.onend = () => {
                isSpeaking = false;
                avatarWrap.classList.remove('speaking-bob');
                stopAudioBtn.disabled = true;
                stopAudioBtn.classList.remove('text-red-500');
                statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
            };
            synthesis.speak(currentUtterance);
        }

        function stopSpeaking() {
            if (synthesis && synthesis.speaking) synthesis.cancel();
            avatarWrap.classList.remove('speaking-bob');
        }

        //        async function requestExplanation() {
            if (conversationHistory.length === 0) return showToast("분석할 대화가 없습니다.");
            
            let targetText = "";
            const lastItem = conversationHistory[conversationHistory.length - 1];
            if(lastItem.role === 'model' || lastItem.role === 'assistant') {
                targetText = lastItem.parts ? lastItem.parts[0].text : lastItem.content;
            } else {
                return showToast("AI 응답을 기다려주세요.");
            }

            const isDesktop = window.innerWidth >= 1024;
            
            if (isDesktop) {
                explanationWidget.innerHTML = `<div class="flex justify-center items-center h-full"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-400"></i></div>`;
            } else {
                statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-yellow-400 shadow-[0_0_5px_#facc15] animate-pulse"></div> 과외 준비 중...';
            }
            
            try {
                const prompt = `문장: ${targetText}\n이 문장에서 핵심이 되는 문법이나 어휘 1가지만 골라 한국어로 알기 쉽게 설명해줘. HTML 태그 <b>나 <ul>등을 써서 예쁘게 꾸며서 줘.`;
                let explanation = "";
                
                if (selectedEngine === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}] })
                    });
                    const data = await res.json();
                    explanation = data.candidates[0].content.parts[0].text;
                } else {
                    const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: [{role: "user", content: prompt}] })
                    });
                    const data = await res.json();
                    explanation = data.choices[0].message.content;
                }
                
                if(isDesktop) {
                    explanationWidget.innerHTML = `<div class="animate-fade-in">${explanation}</div>`;
                } else {
                    addMessageToChat('ai', "💡 <b>족집게 과외:</b><br><br>" + explanation);
                    statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
                }
            } catch (e) {
                if(isDesktop) {
                    explanationWidget.innerHTML = `<span class="text-red-400">분석 실패</span>`;
                } else {
                    showToast("분석 실패");
                    statusText.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></div> 준비됨';
                }
            }
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    </script>
