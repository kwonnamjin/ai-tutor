<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --chat-font-size: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-text-dynamic {
            font-size: var(--chat-font-size);
            line-height: 1.5;
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #3b82f6;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            position: relative;
            margin: 0 auto;
            transition: border-color 0.3s ease;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .speaking-pulse {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .speaking-bob {
            animation: bob 0.5s infinite alternate ease-in-out;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .listening-animation {
            animation: bounce 1s infinite alternate;
            color: #ef4444; 
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="p-0 sm:p-4">

    <!-- App Container -->
    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg focus:ring-blue-500 border border-blue-500 p-2 outline-none cursor-pointer" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                    <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                    <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                </select>
                <button id="settingsBtn" class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center transition-colors border border-blue-500" onclick="toggleSettingsModal(true)">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Engine Indicator Strip -->
        <div class="flex-none bg-slate-100 px-4 py-2 flex justify-between items-center border-b border-gray-200 text-xs">
            <span class="text-gray-500 font-medium">사용 중인 AI 엔진:</span>
            <select id="activeEngine" class="bg-white border border-gray-300 rounded px-2 py-1 font-bold text-gray-700 outline-none cursor-pointer" onchange="changeEngine()">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek (딥시크)</option>
            </select>
        </div>

        <!-- Visual Area / Avatar -->
        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-4 pb-3 flex flex-col items-center justify-center relative border-b border-gray-100 shadow-sm z-10">
            <div id="avatarWrap" class="avatar-container mb-2 transition-all duration-300">
                <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=AI+Tutor'">
            </div>
            <div id="statusText" class="text-xs font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">
                준비됨. 하단 마이크를 눌러 대화를 시작하세요.
            </div>
        </div>

        <!-- Chat / Subtitles Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar">
            <!-- System Welcome Message -->
            <div class="flex flex-col space-y-1">
                <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-sm self-start" id="welcomeMessage">
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1">안녕하세요! 저는 당신의 AI 튜터입니다.</p>
                    <div class="mt-2 text-xs text-blue-600 font-semibold bg-blue-50 p-2 rounded leading-relaxed">
                        <i class="fa-solid fa-circle-info"></i> 원어민 튜터 모드로 대화하거나 즉시 번역 모드를 사용할 수 있습니다.<br>
                        ⚙️ 설정에서 '해설 언어'를 변경하여 원하는 언어로 문법 설명을 들을 수도 있어요!
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 sm:pb-4 px-4 flex flex-col z-20">
            
            <!-- App Mode Selector -->
            <div class="flex justify-center mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 w-full max-w-[300px]">
                    <select id="appMode" class="w-full bg-transparent text-xs font-bold text-gray-700 text-center py-2 outline-none cursor-pointer" onchange="changeAppMode()">
                        <option value="tutor">🎓 원어민 튜터 모드</option>
                        <option value="translate">🌐 즉시 번역 통역기</option>
                    </select>
                </div>
            </div>

            <!-- Full STT Input Language Selector -->
            <div id="sttToggleContainer" class="flex justify-center mb-3 transition-opacity duration-300">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200">
                    <span class="text-[10px] text-gray-500 font-bold px-2">🗣️ 내 음성 언어:</span>
                    <select id="sttInputLanguage" class="bg-white text-xs font-bold text-blue-600 rounded-full px-3 py-1 outline-none shadow-sm cursor-pointer border border-gray-200" onchange="updateStatus('입력 언어가 변경되었습니다.')">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6">
                <!-- Stop Audio Button -->
                <button id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="stopSpeaking()" disabled>
                    <i class="fa-solid fa-volume-xmark text-lg"></i>
                </button>

                <!-- Main Mic Button -->
                <button id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl hover:bg-blue-700 transition-transform transform hover:scale-105 shadow-lg shadow-blue-500/50 outline-none" onclick="toggleListening()">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>

                <!-- Explain Request Button -->
                <button id="explainBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="requestExplanation()">
                    <i class="fa-solid fa-circle-question text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-5 shadow-2xl relative transition-all duration-300 max-h-[95%] overflow-y-auto no-scrollbar">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">⚙️ 앱 상세 설정</h3>
                
                <!-- 1. Text Size Setting -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-text-height text-blue-500"></i> 채팅 글자 크기</label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500">작게</span>
                        <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="14" class="w-full accent-blue-600" oninput="previewFontSize(this.value)">
                        <span class="text-lg text-gray-500">크게</span>
                    </div>
                </div>

                <!-- 2. Voice Gender Setting -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-person-half-dress text-purple-500"></i> AI 목소리 성별</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="genderFemaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors" onclick="selectGender('female')">👩 여성 (호두)</button>
                        <button id="genderMaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors" onclick="selectGender('male')">👨 남성 (치타)</button>
                    </div>
                </div>

                <!-- 3. NEW: Explanation Language Setting -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-language text-green-500"></i> 과외 해설 언어 (설명용)</label>
                    <select id="explanationLanguage" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none bg-gray-50">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어로 해설 듣기</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어로 해설 듣기</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어로 해설 듣기</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어로 해설 듣기</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어로 해설 듣기</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어로 해설 듣기</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어로 해설 듣기</option>
                    </select>
                    <p class="text-[10px] text-gray-400 mt-1">* 튜터가 설명해 주는 언어를 직접 선택할 수 있습니다.</p>
                </div>

                <!-- 4. API Keys Setting -->
                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-800 mb-2"><i class="fa-solid fa-key text-yellow-500"></i> API 키 설정</label>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Google Gemini API Key</label>
                            <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">DeepSeek API Key</label>
                            <input type="password" id="deepseekKeyInput" placeholder="sk-..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Save/Close Buttons -->
                <div class="flex gap-2 mt-6 pt-4 border-t">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm" onclick="toggleSettingsModal(false)">취소</button>
                    <button class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm" onclick="saveSettings()">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State & Config Variables ---
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let currentUtterance = null;
        let conversationHistory = []; 
        
        // Load configurations from localStorage
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let currentFontSize = localStorage.getItem('chat_font_size') || '14';
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';
        let currentExpLanguage = localStorage.getItem('explanation_language') || 'ko-KR';

        // --- DOM Elements ---
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText');
        const chatContainer = document.getElementById('chatContainer');
        const avatarWrap = document.getElementById('avatarWrap');
        const avatarImage = document.getElementById('avatarImage');
        const targetLanguageSelect = document.getElementById('targetLanguage');
        const sttInputLanguageSelect = document.getElementById('sttInputLanguage');
        const explanationLanguageSelect = document.getElementById('explanationLanguage');
        const stopAudioBtn = document.getElementById('stopAudioBtn');
        const appModeSelect = document.getElementById('appMode');

        // Apply loaded settings to UI immediately
        document.getElementById('activeEngine').value = selectedEngine;
        document.getElementById('fontSizeSlider').value = currentFontSize;
        document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);
        explanationLanguageSelect.value = currentExpLanguage;
        updateGenderUI(currentVoiceGender, true); 

        // --- Init Text-to-Speech Voices ---
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => {
            availableVoices = window.speechSynthesis.getVoices();
        };

        // --- App Mode Toggle Logic ---
        function changeAppMode() {
            const mode = appModeSelect.value;
            conversationHistory = []; 
            const targetLangName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            
            if(mode === 'translate') {
                updateStatus("번역 모드: 마이크를 눌러 말하세요.");
                document.getElementById('welcomeMessage').innerHTML = `
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1"><b>🌐 즉시 번역 모드</b>가 켜졌습니다.</p>
                    <p class="text-xs text-gray-500 leading-relaxed">하단에서 '내 음성 언어'를 자유롭게 선택하고 말하면, 우측 상단의 <b>[${targetLangName}]</b>로 즉시 번역해 드립니다.</p>
                `;
            } else {
                changeLanguage(); // 환영 메시지 복구
            }
        }

        // --- Initialize Speech Recognition (STT) ---
        function initSpeechRecognition() {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false; 
                recognition.interimResults = false; 

                recognition.onstart = function() {
                    isListening = true;
                    micBtn.classList.replace('bg-blue-600', 'bg-red-500');
                    micIcon.classList.add('listening-animation');
                    micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    updateStatus("듣는 중...");
                    stopSpeaking(); 
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    handleUserMessage(transcript);
                };

                recognition.onerror = function(event) {
                    console.error("STT Error:", event.error);
                    if (event.error === 'no-speech') {
                        updateStatus("음성이 인식되지 않았습니다.");
                    } else {
                        updateStatus("마이크 오류 발생. 다시 시도해주세요.");
                    }
                    resetMicButton();
                };

                recognition.onend = function() {
                    isListening = false;
                    resetMicButton();
                };
            } else {
                const errMsg = "🚨 음성인식이 지원되지 않는 브라우저입니다.";
                updateStatus(errMsg);
                micBtn.disabled = true;
                micBtn.classList.add('opacity-50');
            }
        }

        initSpeechRecognition();

        function toggleListening() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    // 유저가 설정한 '내 음성 언어'를 STT 엔진에 그대로 주입
                    recognition.lang = sttInputLanguageSelect.value;
                    recognition.start();
                } catch(e) { console.error(e); }
            }
        }

        // --- Settings Modal Logic ---
        function toggleSettingsModal(show = true) {
            const modal = document.getElementById('settingsModal');
            if(show) {
                document.getElementById('geminiKeyInput').value = geminiApiKey;
                document.getElementById('deepseekKeyInput').value = deepseekApiKey;
                document.getElementById('fontSizeSlider').value = currentFontSize;
                explanationLanguageSelect.value = currentExpLanguage;
                updateGenderUI(currentVoiceGender, false);
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);
                document.getElementById('fontSizeSlider').value = currentFontSize;
            }
        }

        function previewFontSize(size) {
            document.documentElement.style.setProperty('--chat-font-size', `${size}px`);
        }

        let tempGender = currentVoiceGender;
        function selectGender(gender) {
            tempGender = gender;
            updateGenderUI(gender, false); 
        }

        function updateGenderUI(gender, applyImage = false) {
            const fBtn = document.getElementById('genderFemaleBtn');
            const mBtn = document.getElementById('genderMaleBtn');
            
            if (gender === 'female') {
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors border border-blue-200";
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors border border-transparent";
                if(applyImage) avatarImage.src = "호두 꿀벌_2.jpg";
            } else {
                mBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-colors border border-blue-200";
                fBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-colors border border-transparent";
                if(applyImage) avatarImage.src = "치타 팔짱_2.jpg";
            }
        }

        function saveSettings() {
            geminiApiKey = document.getElementById('geminiKeyInput').value.trim();
            deepseekApiKey = document.getElementById('deepseekKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey);
            localStorage.setItem('deepseek_api_key', deepseekApiKey);
            
            currentFontSize = document.getElementById('fontSizeSlider').value;
            localStorage.setItem('chat_font_size', currentFontSize);
            document.documentElement.style.setProperty('--chat-font-size', `${currentFontSize}px`);

            currentExpLanguage = explanationLanguageSelect.value;
            localStorage.setItem('explanation_language', currentExpLanguage);

            currentVoiceGender = tempGender;
            localStorage.setItem('voice_gender', currentVoiceGender);
            updateGenderUI(currentVoiceGender, true);

            toggleSettingsModal(false);
            updateStatus("설정이 저장되었습니다.");
        }

        function changeEngine() {
            selectedEngine = document.getElementById('activeEngine').value;
            localStorage.setItem('active_engine', selectedEngine);
            conversationHistory = []; 
            updateStatus(`엔진 변경: ${selectedEngine}`);
        }

        function changeLanguage() {
            if(appModeSelect.value === 'translate') {
                updateStatus(`번역 목표 언어 변경됨`);
                return; 
            }
            
            conversationHistory = [];
            const langName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            updateStatus(`언어 전환: ${langName}`);
            
            // 튜터 모드일 경우 편의를 위해 '내 음성 언어'도 목표 언어로 자동 전환 (원어민 연습용)
            sttInputLanguageSelect.value = targetLanguageSelect.value;

            const welcomeDiv = document.getElementById('welcomeMessage');
            welcomeDiv.innerHTML = `
                <p class="chat-text-dynamic text-gray-800 font-medium mb-1"><b>${langName}</b> 튜터 모드가 활성화되었습니다.</p>
                <div class="mt-2 text-xs text-blue-600 font-semibold bg-blue-50 p-2 rounded leading-relaxed">
                    <i class="fa-solid fa-check"></i> '내 음성 언어'를 <b>${langName}</b>로 두고 말하기를 연습하세요.<br>모르는 걸 질문할 땐 하단에서 <b>한국어</b>로 바꿔서 편하게 질문하세요!
                </div>
            `;
            stopSpeaking();
        }

        function resetMicButton() {
            micBtn.classList.replace('bg-red-500', 'bg-blue-600');
            micIcon.classList.remove('listening-animation');
            micIcon.classList.replace('fa-ear-listen', 'fa-microphone');
            if(!isSpeaking) updateStatus("대기 중");
        }

        function updateStatus(text) { statusText.textContent = text; }

        function playSavedAudio(btnElem) {
            const text = btnElem.getAttribute('data-speak-text');
            const lang = btnElem.getAttribute('data-lang-code');
            if(text && lang) speakText(text, lang);
        }

        // --- Core Message Rendering ---
        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex flex-col space-y-1 mt-4 fade-in";
            
            let bubbleHtml = '';

            if (sender === 'user') {
                bubbleHtml = `
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] shadow-md self-end">
                        <p class="chat-text-dynamic">${text}</p>
                    </div>
                `;
            } else if (sender === 'ai') {
                const escapedText = text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                let translationHtml = translation ? `<p class="text-xs text-gray-500 mt-2 border-t pt-2 border-gray-100">${translation}</p>` : '';
                
                let replayBtnHtml = targetLangCode ? `
                    <button onclick="playSavedAudio(this)" data-speak-text="${escapedText}" data-lang-code="${targetLangCode}" class="ml-2 text-blue-400 hover:text-blue-600 transition-colors w-7 h-7 flex shrink-0 items-center justify-center rounded-full hover:bg-blue-50 shadow-sm border border-blue-100 bg-white">
                        <i class="fa-solid fa-volume-high text-sm"></i>
                    </button>
                ` : '';

                bubbleHtml = `
                    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-md self-start">
                        <div class="flex items-start justify-between gap-2">
                            <p class="chat-text-dynamic font-medium text-gray-800 break-words">${text}</p>
                            ${replayBtnHtml}
                        </div>
                        ${translationHtml}
                    </div>
                `;
            }

            msgDiv.innerHTML = bubbleHtml;
            chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok || response.status === 400 || response.status === 403) return response;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function handleUserMessage(text) {
            addMessageToChat('user', text);
            
            if (selectedEngine === 'gemini' && !geminiApiKey) return toggleSettingsModal(true);
            if (selectedEngine === 'deepseek' && !deepseekApiKey) return toggleSettingsModal(true);

            updateStatus("생각하는 중...");
            avatarWrap.style.borderColor = "#9ca3af"; 

            const selectedLangCode = targetLanguageSelect.value;
            const selectedLangName = targetLanguageSelect.options[targetLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            const inputLangName = sttInputLanguageSelect.options[sttInputLanguageSelect.selectedIndex].getAttribute('data-lang-name');
            const appMode = appModeSelect.value;

            let systemPrompt = "";

            if (appMode === 'translate') {
                systemPrompt = `당신은 최고 수준의 전문 동시통역가입니다. 
사용자가 입력한 [${inputLangName}] 문장을 [${selectedLangName}]로 완벽하게 번역하세요.
의역보다는 해당 국가의 사람들이 쓰는 가장 자연스러운 현지 표현을 사용하세요.
출력은 반드시 아래 JSON 형식이어야 합니다:
{
    "foreign_text": "번역된 ${selectedLangName} 문장",
    "korean_translation": ""
}`;
            } else {
                systemPrompt = `당신은 친절하고 전문적인 '${selectedLangName}' 원어민 튜터입니다.
상황 규정:
1. 사용자가 '${selectedLangName}'로 말했다면, 그에 어울리는 원어민 수준의 답변을 '${selectedLangName}'로 이어나가세요.
2. 사용자가 다른 언어(${inputLangName})로 말했다면, 그 말을 분석하여 '${selectedLangName}'로 답변/번역을 제공하면서 자연스럽게 대화를 유도하세요.
3. 사용자가 보낸 문장에 오류가 있다면 가볍게 바로잡아 주세요.
4. 답변은 반드시 아래 JSON 형식으로만 완벽하게 출력하세요:
{
    "foreign_text": "오직 ${selectedLangName}로만 작성된 튜터의 자연스러운 대화 내용 (원어민 억양 TTS 재생용)",
    "korean_translation": "해당 답변의 자연스러운 모국어 해석 및 사용자 코멘트/피드백"
}
5. 대화는 한 번에 1~2문장 정도로 가볍게 작성하세요.`;
            }

            let foreignText = "", koreanText = "";

            try {
                if (selectedEngine === 'gemini') {
                    if (appMode === 'tutor' && conversationHistory.length === 0) {
                        conversationHistory.push({ role: "user", parts: [{ text: "Hello." }] });
                        conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify({ foreign_text: "Hello! Let's start the conversation.", korean_translation: "안녕하세요! 대화를 시작합시다." }) }] });
                    }
                    
                    let userContent = `[입력언어: ${inputLangName}] ${text}`;
                    
                    let currentContext = (appMode === 'translate') ? [] : conversationHistory;
                    currentContext.push({ role: "user", parts: [{ text: userContent }] });
                    
                    if (currentContext.length > 8) currentContext.shift();

                    const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: currentContext, systemInstruction: { parts: [{ text: systemPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
                    });

                    if (!response.ok) throw new Error(`Gemini Error`);
                    const result = await response.json();
                    const parsedResponse = JSON.parse(result.candidates[0].content.parts[0].text);
                    foreignText = parsedResponse.foreign_text;
                    koreanText = parsedResponse.korean_translation;
                    
                    if(appMode === 'tutor') {
                        conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(parsedResponse) }] });
                    } else {
                        currentContext.pop(); 
                    }

                } else {
                    let currentContext = [];
                    if (appMode === 'tutor') {
                        if(conversationHistory.length === 0) conversationHistory.push({ role: "system", content: systemPrompt });
                        conversationHistory.push({ role: "user", content: `[입력언어: ${inputLangName}] ${text}` });
                        if (conversationHistory.length > 9) conversationHistory = [conversationHistory[0], ...conversationHistory.slice(conversationHistory.length - 8)];
                        currentContext = conversationHistory;
                    } else {
                        currentContext = [{ role: "system", content: systemPrompt }, { role: "user", content: text }];
                    }

                    const response = await fetchWithRetry("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: currentContext, response_format: { type: "json_object" }, temperature: 0.7 })
                    });

                    if (!response.ok) throw new Error(`DeepSeek Error`);
                    const result = await response.json();
                    const parsedResponse = JSON.parse(result.choices[0].message.content);
                    foreignText = parsedResponse.foreign_text;
                    koreanText = parsedResponse.korean_translation;
                    
                    if(appMode === 'tutor') {
                        conversationHistory.push({ role: "assistant", content: JSON.stringify(parsedResponse) });
                    }
                }

                if (foreignText) {
                    addMessageToChat('ai', foreignText, koreanText, selectedLangCode);
                    speakText(foreignText, selectedLangCode);
                }

            } catch (error) {
                console.error(error);
                updateStatus("오류 발생. API 키를 재확인하세요.");
                avatarWrap.style.borderColor = "#ef4444"; 
            }
        }

        // --- Text-to-Speech (TTS) Logic ---
        function speakText(text, langCode) {
            if (!synthesis) return;
            stopSpeaking(); 

            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = langCode; 
            
            let langVoices = availableVoices.filter(v => v.lang.includes(langCode) || v.lang.replace('-','_') === langCode.replace('-','_'));
            
            if (langVoices.length > 0) {
                const isFemale = (currentVoiceGender === 'female');
                let matchedVoice = langVoices.find(v => {
                    const name = v.name.toLowerCase();
                    if (isFemale) return name.includes('female') || name.includes('woman') || name.includes('girl') || name.includes('samantha');
                    else return name.includes('male') || name.includes('man') || name.includes('boy') || name.includes('alex') || name.includes('david');
                });
                
                if (!matchedVoice) {
                    let googleVoices = langVoices.filter(v => v.name.includes('Google'));
                    if (googleVoices.length > 1) {
                        matchedVoice = isFemale ? googleVoices[0] : googleVoices[1];
                    } else if (langVoices.length > 1) {
                        matchedVoice = isFemale ? langVoices[0] : langVoices[langVoices.length - 1];
                    } else {
                        matchedVoice = langVoices[0];
                    }
                }
                currentUtterance.voice = matchedVoice;
            }

            currentUtterance.rate = 0.95; 
            
            if (currentVoiceGender === 'female') {
                currentUtterance.pitch = 1.2; 
            } else {
                currentUtterance.pitch = 0.7; 
            }

            currentUtterance.onstart = () => {
                isSpeaking = true;
                updateStatus("말하는 중...");
                avatarWrap.classList.add('speaking-pulse');
                avatarWrap.classList.add('speaking-bob'); 
                avatarWrap.style.borderColor = "#3b82f6"; 
                stopAudioBtn.disabled = false;
                stopAudioBtn.classList.replace('text-gray-600', 'text-red-500');
            };

            currentUtterance.onend = () => {
                isSpeaking = false;
                updateStatus("대기 중");
                avatarWrap.classList.remove('speaking-pulse');
                avatarWrap.classList.remove('speaking-bob'); 
                stopAudioBtn.disabled = true;
                stopAudioBtn.classList.replace('text-red-500', 'text-gray-600');
            };

            currentUtterance.onerror = () => { 
                isSpeaking = false; 
                avatarWrap.classList.remove('speaking-pulse'); 
                avatarWrap.classList.remove('speaking-bob');
            };
            
            synthesis.speak(currentUtterance);
        }

        function stopSpeaking() {
            if (synthesis && synthesis.speaking) synthesis.cancel();
            avatarWrap.classList.remove('speaking-pulse');
            avatarWrap.classList.remove('speaking-bob');
        }

        // --- Auxiliary Feature: Quick Explanation in Custom Language ---
        async function requestExplanation() {
            if (conversationHistory.length === 0 && appModeSelect.value === 'translate') {
                updateStatus("설명할 이전 대화가 없습니다."); return;
            }
            if ((selectedEngine === 'gemini' && !geminiApiKey) || (selectedEngine === 'deepseek' && !deepseekApiKey)) return;
            
            updateStatus("해설 분석 중...");
            
            // Get last AI message from chat UI if history is empty (e.g. translate mode)
            let lastAiMsg = "";
            const aiBubbles = document.querySelectorAll('#chatContainer > div > .bg-white.border');
            if(aiBubbles.length > 0) {
                const lastBubble = aiBubbles[aiBubbles.length - 1];
                lastAiMsg = lastBubble.querySelector('.chat-text-dynamic').innerText;
            }

            if(!lastAiMsg) return updateStatus("설명할 문장을 찾지 못했습니다.");

            // 설정에서 사용자가 선택한 해설 언어 정보 가져오기
            const expLangCode = explanationLanguageSelect.value;
            const expLangName = explanationLanguageSelect.options[explanationLanguageSelect.selectedIndex].getAttribute('data-lang-name');

            const prompt = `방금 대화 문장 ("${lastAiMsg}") 내에 있는 가장 중요한 단어나 문법 1개를 골라, 반드시 [${expLangName}] 언어로 아주 짧고 친절하게 과외 선생님처럼 해설을 작성해줘.`;
            
            try {
                let explanation = "";
                if (selectedEngine === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    explanation = data.candidates[0].content.parts[0].text;
                } else {
                    const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` }, body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                    });
                    const data = await res.json();
                    explanation = data.choices[0].message.content;
                }

                if (explanation) {
                    const escapedText = explanation.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                    const msgDiv = document.createElement('div');
                    msgDiv.className = "flex flex-col space-y-1 mt-4 fade-in";
                    msgDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 w-full shadow-md relative">
                            <button onclick="playSavedAudio(this)" data-speak-text="${escapedText}" data-lang-code="${expLangCode}" class="absolute top-3 right-3 text-yellow-600 hover:text-yellow-800 bg-yellow-100 hover:bg-yellow-200 w-7 h-7 flex shrink-0 items-center justify-center rounded-full transition-colors shadow-sm">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                            <p class="text-xs font-bold text-yellow-800 mb-2"><i class="fa-solid fa-lightbulb"></i> 맞춤형 족집게 과외 (${expLangName})</p>
                            <p class="chat-text-dynamic text-gray-800 pr-6 leading-relaxed">${explanation.replace(/\n/g, '<br>')}</p>
                        </div>
                    `;
                    chatContainer.appendChild(msgDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    updateStatus("대기 중");
                }
            } catch (e) {
                updateStatus("설명 불러오기 실패");
            }
        }
    </script>
