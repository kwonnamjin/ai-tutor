<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 실시간 언어 튜터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --chat-font-size: 14px; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-text-dynamic { font-size: var(--chat-font-size); line-height: 1.5; }
        
        .avatar-container { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid #3b82f6; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); position: relative; margin: 0 auto; transition: border-color 0.3s ease; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        
        .speaking-pulse { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .speaking-bob { animation: bob 0.5s infinite alternate ease-in-out; }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .listening-animation { animation: bounce 1s infinite alternate; color: #ef4444; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 터치 선택용 단어 스타일 */
        .word-span { cursor: pointer; display: inline-block; padding: 0 2px; border-radius: 4px; transition: background-color 0.2s; }
        .word-span.selected { background-color: #fef08a; /* yellow-200 */ color: #854d0e; /* yellow-800 */ font-weight: 600; }
        
        /* 해설창 안의 선택 단어 스타일 (조금 더 진하게) */
        .exp-word-span { cursor: pointer; display: inline-block; padding: 0 2px; border-radius: 4px; transition: background-color 0.2s; }
        .exp-word-span.selected { background-color: #fde047; /* yellow-300 */ color: #a16207; font-weight: 600; }
    </style>
</head>
<body class="p-0 sm:p-4" onclick="handleBodyClick(event)">

    <div class="bg-white w-full max-w-md h-full sm:h-[850px] max-h-full sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="flex-none bg-blue-600 text-white p-4 flex justify-between items-center z-10 shadow-md">
            <div>
                <h1 class="text-xl font-bold">TalkAI Tutor</h1>
                <p class="text-xs text-blue-200">실시간 언어 학습 파트너</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="targetLanguage" class="bg-blue-700 text-white text-xs rounded-lg focus:ring-blue-500 border border-blue-500 p-2 outline-none cursor-pointer" onchange="changeLanguage()">
                    <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                    <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                    <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                    <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                    <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                    <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                </select>
                <button class="w-10 h-10 rounded-lg bg-blue-700 hover:bg-blue-800 flex items-center justify-center transition-colors border border-blue-500 shadow-sm" onclick="toggleSettingsModal(true)">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Engine Indicator -->
        <div class="flex-none bg-slate-100 px-4 py-2 flex justify-between items-center border-b border-gray-200 text-xs">
            <span class="text-gray-500 font-medium">사용 중인 AI 엔진:</span>
            <select id="activeEngine" class="bg-white border border-gray-300 rounded px-2 py-1 font-bold text-gray-700 outline-none cursor-pointer shadow-sm" onchange="changeEngine()">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek (딥시크)</option>
            </select>
        </div>

        <!-- Avatar Area -->
        <div class="flex-none bg-gradient-to-b from-blue-50 to-white pt-4 pb-3 flex flex-col items-center justify-center relative border-b border-gray-100 shadow-sm z-10">
            <div id="avatarWrap" class="avatar-container mb-2 transition-all duration-300">
                <img src="호두 꿀벌_2.jpg" alt="AI Avatar" class="avatar-img" id="avatarImage" onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=AI+Tutor'">
            </div>
            <div id="statusText" class="text-xs font-semibold text-gray-500 bg-white border border-gray-200 px-4 py-1.5 rounded-full shadow-sm">
                준비됨. 하단 마이크를 눌러 시작하세요.
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 no-scrollbar pb-6">
            <div class="flex flex-col space-y-1">
                <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-sm self-start" id="welcomeMessage">
                    <p class="chat-text-dynamic text-gray-800 font-medium mb-1">안녕하세요! 저는 당신의 AI 튜터입니다.</p>
                    <div class="mt-2 text-xs text-blue-600 font-semibold bg-blue-50 p-2 rounded leading-relaxed">
                        <i class="fa-solid fa-circle-info"></i> 단어를 연속으로 두 번 터치하면 <b>구간이 선택</b>됩니다.<br>선택 후 전구(💡)를 누르면 그 부분만 과외해 드려요!
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="flex-none bg-white border-t border-gray-200 pt-3 pb-6 sm:pb-4 px-4 flex flex-col z-20">
            
            <div class="flex justify-center gap-2 mb-3">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 flex-1 max-w-[200px] shadow-sm">
                    <select id="appMode" class="w-full bg-transparent text-xs font-bold text-gray-700 text-center py-2 outline-none cursor-pointer" onchange="changeAppMode()">
                        <option value="tutor">🎓 대화형 튜터 모드</option>
                        <option value="translate">🌐 통번역 모드</option>
                    </select>
                </div>
            </div>

            <div id="sttToggleContainer" class="flex justify-center mb-3 transition-opacity duration-300">
                <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 shadow-sm">
                    <span class="text-[10px] text-gray-500 font-bold px-2">🗣️ 내 음성 언어:</span>
                    <select id="sttInputLanguage" class="bg-white text-xs font-bold text-blue-600 rounded-full px-3 py-1 outline-none shadow-sm cursor-pointer border border-gray-200" onchange="updateStatus('입력 언어 변경됨')">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6">
                <button id="stopAudioBtn" class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="stopSpeaking()" disabled>
                    <i class="fa-solid fa-volume-xmark text-lg"></i>
                </button>

                <button id="micBtn" class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl hover:bg-blue-700 transition-transform transform hover:scale-105 shadow-lg shadow-blue-500/50 outline-none" onclick="toggleListening()">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>

                <button class="w-12 h-12 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors shadow outline-none" onclick="requestExplanationGlobal()">
                    <i class="fa-solid fa-circle-question text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-[360px] rounded-2xl p-5 shadow-2xl relative transition-all duration-300 max-h-[95%] overflow-y-auto no-scrollbar">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">⚙️ 상세 설정</h3>
                
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">채팅 글자 크기</label>
                    <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="14" class="w-full accent-blue-600" oninput="document.documentElement.style.setProperty('--chat-font-size', this.value + 'px')">
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">AI 목소리 성별</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="genderFemaleBtn" class="flex-1 py-2 text-sm font-bold rounded-md bg-white text-blue-600" onclick="selectGender('female')">👩 여성 </button>
                        <button id="genderMaleBtn" class="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-200" onclick="selectGender('male')">👨 남성 </button>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">과외 해설 언어</label>
                    <select id="explanationLanguage" class="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none bg-gray-50">
                        <option value="ko-KR" data-lang-name="한국어">🇰🇷 한국어</option>
                        <option value="en-US" data-lang-name="영어">🇺🇸 영어</option>
                        <option value="ja-JP" data-lang-name="일본어">🇯🇵 일본어</option>
                        <option value="zh-CN" data-lang-name="중국어">🇨🇳 중국어</option>
                        <option value="es-ES" data-lang-name="스페인어">🇪🇸 스페인어</option>
                        <option value="th-TH" data-lang-name="태국어">🇹🇭 태국어</option>
                        <option value="vi-VN" data-lang-name="베트남어">🇻🇳 베트남어</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">API 키 설정</label>
                    <input type="password" id="geminiKeyInput" placeholder="Gemini Key" class="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none mb-2">
                    <input type="password" id="deepseekKeyInput" placeholder="DeepSeek Key" class="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none">
                </div>

                <div class="flex gap-2 mt-6 pt-4 border-t">
                    <button class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-lg text-sm" onclick="toggleSettingsModal(false)">취소</button>
                    <button class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm" onclick="saveSettings()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Variables ---
        let isListening = false, isSpeaking = false, recognition = null;
        const synthesis = window.speechSynthesis;
        let conversationHistory = []; 
        
        let selectedEngine = localStorage.getItem('active_engine') || 'gemini';
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
        let currentVoiceGender = localStorage.getItem('voice_gender') || 'female';
        
        // Touch Selection Variables
        let currentBubbleId = null;
        let startIndex = -1;
        let endIndex = -1;
        let bubbleCounter = 0;

        // Elements
        const micBtn = document.getElementById('micBtn'), micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText'), chatContainer = document.getElementById('chatContainer');
        const avatarWrap = document.getElementById('avatarWrap'), avatarImage = document.getElementById('avatarImage');
        const stopAudioBtn = document.getElementById('stopAudioBtn');

        // Apply Load Settings
        document.getElementById('activeEngine').value = selectedEngine;
        document.getElementById('explanationLanguage').value = localStorage.getItem('explanation_language') || 'ko-KR';
        updateGenderUI(currentVoiceGender, true); 

        // --- STT ---
        function initSpeechRecognition() {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.onstart = () => {
                    isListening = true; stopSpeaking(); 
                    micBtn.classList.replace('bg-blue-600', 'bg-red-500'); micIcon.classList.replace('fa-microphone', 'fa-ear-listen');
                    updateStatus("듣는 중...");
                };
                recognition.onresult = (e) => handleUserMessage(e.results[0][0].transcript);
                recognition.onerror = () => { resetMic(); updateStatus("인식 실패"); };
                recognition.onend = () => resetMic();
            } else { updateStatus("STT 미지원 환경"); }
        }
        initSpeechRecognition();

        function toggleListening() {
            if(!recognition) return;
            if(isListening) recognition.stop();
            else { recognition.lang = document.getElementById('sttInputLanguage').value; recognition.start(); }
        }
        function resetMic() { isListening = false; micBtn.classList.replace('bg-red-500', 'bg-blue-600'); micIcon.classList.replace('fa-ear-listen', 'fa-microphone'); if(!isSpeaking) updateStatus("대기 중"); }
        function updateStatus(txt) { statusText.textContent = txt; }

        // --- Smart Touch Selection Logic ---
        function clearSelection() {
            // 메인 대화창 및 해설창 모두의 선택 해제
            document.querySelectorAll('.word-span, .exp-word-span').forEach(el => el.classList.remove('selected'));
            startIndex = -1; endIndex = -1; currentBubbleId = null;
        }
        
        // 메인 채팅 말풍선 & 해설 말풍선 공용 클릭 핸들러
        function handleWordClick(event, bubbleId, wordIndex, isExplanation = false) {
            event.stopPropagation(); // 배경 클릭 무시
            
            // 다른 말풍선을 클릭했으면 초기화
            if (currentBubbleId !== null && currentBubbleId !== bubbleId) clearSelection();
            currentBubbleId = bubbleId;

            if (startIndex === -1) {
                // 첫 번째 단어 선택
                startIndex = wordIndex;
                endIndex = wordIndex;
            } else if (startIndex === wordIndex && endIndex === wordIndex) {
                // 똑같은 단어 두번 누르면 취소
                clearSelection(); return;
            } else {
                // 두 번째 단어 선택 (구간 지정)
                endIndex = wordIndex;
                // 정방향/역방향 드래그 보정
                if (startIndex > endIndex) { let temp = startIndex; startIndex = endIndex; endIndex = temp; }
            }

            // 시각적 하이라이트 적용
            const container = document.getElementById(`bubble-${bubbleId}`);
            const spanClass = isExplanation ? '.exp-word-span' : '.word-span';
            const words = container.querySelectorAll(spanClass);
            
            words.forEach(span => {
                const idx = parseInt(span.getAttribute('data-index'));
                if (idx >= startIndex && idx <= endIndex) span.classList.add('selected');
                else span.classList.remove('selected');
            });
        }

        // 말풍선 밖 배경 클릭 시 선택 해제
        function handleBodyClick(e) {
            // 클릭한 요소가 단어(span)가 아니며 버튼도 아닐 때
            if (!e.target.classList.contains('word-span') && !e.target.classList.contains('exp-word-span') && !e.target.closest('button')) {
                clearSelection();
            }
        }

        // 특정 버블(메인 또는 해설)에서 현재 노란색으로 하이라이트 된 텍스트만 추출
        function getSelectedTextFromBubble(bubbleId, isExplanation = false) {
            if(startIndex === -1) return null;
            const container = document.getElementById(`bubble-${bubbleId}`);
            if(!container) return null;
            let textArr = [];
            const spanClass = isExplanation ? '.exp-word-span' : '.word-span';
            const words = container.querySelectorAll(spanClass);
            words.forEach(span => {
                const idx = parseInt(span.getAttribute('data-index'));
                if (idx >= startIndex && idx <= endIndex) textArr.push(span.textContent);
            });
            return textArr.join(' ');
        }

        // 전체 텍스트를 터치 가능한 Span 태그들로 쪼개는 헬퍼 함수
        function createSpansForText(text, bubbleId, isExplanation = false) {
            const wordsArray = text.split(' ');
            const spanClass = isExplanation ? 'exp-word-span' : 'word-span';
            return wordsArray.map((word, idx) => 
                `<span class="${spanClass}" data-index="${idx}" onclick="handleWordClick(event, '${bubbleId}', ${idx}, ${isExplanation})">${word}</span>`
            ).join(' ');
        }

        // --- Message Rendering ---
        function addMessageToChat(sender, text, translation = null, targetLangCode = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex flex-col space-y-1 mt-4";
            
            if (sender === 'user') {
                msgDiv.innerHTML = `<div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] self-end chat-text-dynamic">${text}</div>`;
            } else {
                bubbleCounter++;
                const bId = `ai-msg-${bubbleCounter}`;
                // 속성용(TTS): 마크다운 등 방해 기호 없는 순수 텍스트
                const pureText = text.replace(/[\*\#\`]/g, '');
                const escapedFullText = pureText.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                
                // 화면용: 마크다운 굵기를 살려 보여주기 위해 정규식 변환 후, 다시 띄어쓰기로 쪼갬
                const visualText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                const spansHtml = createSpansForText(visualText, bId, false);

                let extraHtml = `
                    <div class="flex gap-1 ml-2 shrink-0">
                        <button onclick="requestExplanationFromBubble('${bId}', '${escapedFullText}', false)" class="text-green-500 hover:bg-green-50 w-7 h-7 rounded-full bg-white shadow-sm border border-green-100 flex items-center justify-center" title="과외 받기"><i class="fa-solid fa-lightbulb"></i></button>
                        <button onclick="speakText('${escapedFullText}', '${targetLangCode}')" class="text-blue-400 hover:bg-blue-50 w-7 h-7 rounded-full bg-white shadow-sm border border-blue-100 flex items-center justify-center" title="다시 듣기"><i class="fa-solid fa-volume-high"></i></button>
                    </div>`;

                msgDiv.innerHTML = `
                    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 max-w-[90%] shadow-md self-start relative">
                        <div class="flex items-start justify-between gap-2">
                            <p id="bubble-${bId}" class="chat-text-dynamic text-gray-800 break-words leading-relaxed">${spansHtml}</p>
                            ${extraHtml}
                        </div>
                        ${translation ? `<p class="text-[11px] text-gray-500 mt-2 border-t pt-1.5 border-gray-100">${translation}</p>` : ''}
                    </div>`;
            }
            chatContainer.appendChild(msgDiv);
            setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50);
        }

        // --- TTS Engine (Smooth Reading) ---
        function cleanTextForTTS(raw) {
            return raw.replace(/[\*\#\`\~\"\'\(\)\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function speakText(text, langCode) {
            if(!synthesis) return;
            synthesis.cancel();
            
            const clean = cleanTextForTTS(text);
            if(!clean) return;

            currentUtterance = new SpeechSynthesisUtterance(clean);
            currentUtterance.lang = langCode;
            
            let voices = synthesis.getVoices().filter(v => v.lang.startsWith(langCode.substring(0,2)));
            if(voices.length>0) {
                const isF = currentVoiceGender === 'female';
                let v = voices.find(x => isF ? (x.name.toLowerCase().includes('female') || x.name.toLowerCase().includes('girl')) : (x.name.toLowerCase().includes('male') || x.name.toLowerCase().includes('boy')));
                currentUtterance.voice = v || voices[0];
            }
            
            currentUtterance.rate = 0.95;
            currentUtterance.pitch = currentVoiceGender === 'female' ? 1.2 : 0.7;

            currentUtterance.onstart = () => { isSpeaking = true; avatarWrap.classList.add('speaking-pulse', 'speaking-bob'); avatarWrap.style.borderColor = "#3b82f6"; stopAudioBtn.disabled = false; stopAudioBtn.classList.replace('text-gray-600', 'text-red-500'); updateStatus("말하는 중..."); };
            currentUtterance.onend = () => { isSpeaking = false; avatarWrap.classList.remove('speaking-pulse', 'speaking-bob'); stopAudioBtn.disabled = true; stopAudioBtn.classList.replace('text-red-500', 'text-gray-600'); updateStatus("대기 중"); };
            currentUtterance.onerror = () => currentUtterance.onend();

            synthesis.speak(currentUtterance);
        }
        function stopSpeaking() { synthesis.cancel(); }

        // --- LLM API Logic ---
        async function fetchAPI(url, options) {
            let delay=500;
            for(let i=0;i<3;i++) {
                try { const res = await fetch(url, options); if(res.ok) return res; await new Promise(r=>setTimeout(r,delay)); delay*=2; }
                catch(e) { if(i==2) throw e; }
            }
        }

        async function handleUserMessage(text) {
            if(!text) return;
            addMessageToChat('user', text);
            if(!geminiApiKey && !deepseekApiKey) return toggleSettingsModal(true);

            updateStatus("생각하는 중..."); avatarWrap.style.borderColor = "#9ca3af";
            const mode = document.getElementById('appMode').value;
            const tLang = document.getElementById('targetLanguage');
            const targetLang = tLang.value, targetName = tLang.options[tLang.selectedIndex].dataset.langName;
            const inputName = document.getElementById('sttInputLanguage').options[document.getElementById('sttInputLanguage').selectedIndex].dataset.langName;

            let sysPrompt = mode === 'translate' 
                ? `사용자(${inputName}) 문장을 완벽히 [${targetName}]로 번역해라. 의역을 살려 현지인처럼. 출력포맷 JSON: {"foreign_text":"번역결과","korean_translation":"번역결과의 한글 해석"}`
                : `당신은 유쾌한 '${targetName}' 원어민 튜터다. 사용자가 '${targetName}'로 말하면 친구처럼 맞장구치며 대화를 이어가고, 다른 언어로 말하면 자연스럽게 해석하며 '${targetName}' 대화로 유도해라. 대화는 1~2문장으로 짧게. 출력포맷 JSON: {"foreign_text":"오직 ${targetName}로만 작성된 당신의 답변","korean_translation":"답변의 정확한 한글 해석 및 사용자 문법 교정"}`;

            try {
                let foreign="", korean="";
                if(selectedEngine==='gemini') {
                    if(mode==='tutor' && conversationHistory.length===0) conversationHistory.push({role:"user",parts:[{text:"Hi"}]},{role:"model",parts:[{text:JSON.stringify({foreign_text:"Hello! Let's talk.",korean_translation:"안녕! 대화하자."})}]});
                    let ctx = mode==='translate'?[]:conversationHistory;
                    ctx.push({role:"user",parts:[{text:`[입력:${inputName}] ${text}`}]});
                    if(ctx.length>8) ctx.shift();
                    
                    let res = await fetchAPI(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:ctx,systemInstruction:{parts:[{text:sysPrompt}]},generationConfig:{responseMimeType:"application/json"}})});
                    let data = await res.json();
                    let parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    if(mode==='tutor') conversationHistory.push({role:"model",parts:[{text:JSON.stringify(parsed)}]});
                    else ctx.pop();
                } else {
                    let ctx = mode==='tutor'?conversationHistory:[{role:"system",content:sysPrompt},{role:"user",content:text}];
                    if(mode==='tutor') {
                        if(ctx.length===0) ctx.push({role:"system",content:sysPrompt});
                        ctx.push({role:"user",content:`[입력:${inputName}] ${text}`});
                        if(ctx.length>9) ctx=[ctx[0], ...ctx.slice(-8)];
                    }
                    let res = await fetchAPI("https://api.deepseek.com/v1/chat/completions",{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${deepseekApiKey}`},body:JSON.stringify({model:"deepseek-chat",messages:ctx,response_format:{type:"json_object"}})});
                    let data = await res.json();
                    let parsed = JSON.parse(data.choices[0].message.content);
                    foreign = parsed.foreign_text; korean = parsed.korean_translation;
                    if(mode==='tutor') conversationHistory.push({role:"assistant",content:JSON.stringify(parsed)});
                }
                
                if(foreign) {
                    addMessageToChat('ai', foreign, korean, targetLang);
                    speakText(foreign, targetLang);
                }
            } catch(e) { updateStatus("API 연동 에러"); avatarWrap.style.borderColor="#ef4444"; }
        }

        // --- Explanation Logic (Smart Select & Full Sentence) ---
        async function requestExplanationGlobal() {
            const aiBubbles = document.querySelectorAll('#chatContainer > div > .bg-white.border:not(.bg-yellow-50)');
            if(aiBubbles.length === 0) return updateStatus("설명할 대화가 없습니다.");
            
            const lastContainer = aiBubbles[aiBubbles.length-1];
            const pTag = lastContainer.querySelector('p[id^="bubble-"]');
            if(!pTag) return;
            const bId = pTag.id.replace('bubble-','');
            
            // 글로벌 버튼을 눌렀을 때는 메인 채팅창(isExplanation=false) 기준으로 가져옴
            const selTxt = getSelectedTextFromBubble(bId, false);
            const fullTxt = Array.from(pTag.querySelectorAll('span')).map(s=>s.textContent).join(' ');
            
            requestExplanationFromBubble(bId, fullTxt, false, selTxt);
        }

        // bId: 버블ID, fullText: 버블의 전체텍스트, isExpSource: 해설창에서 누른 전구인지 여부, preSelectedText: (글로벌버튼용)미리추출된선택단어
        async function requestExplanationFromBubble(bId, fullText, isExpSource = false, preSelectedText = null) {
            updateStatus("해설 분석 중...");
            
            const expSel = document.getElementById('explanationLanguage');
            const expLangName = expSel.options[expSel.selectedIndex].dataset.langName;
            const expLangCode = expSel.value;
            
            // 파라미터로 선택 단어가 안넘어왔다면 현재 클릭된 말풍선에서 직접 추출
            const targetWord = preSelectedText || getSelectedTextFromBubble(bId, isExpSource);
            
            let prompt = "";
            let focusTitle = "";
            
            // 특수기호 제거 (순수 텍스트 기반으로 프롬프트 전송)
            const cleanFullText = cleanTextForTTS(fullText);
            const cleanTargetWord = targetWord ? cleanTextForTTS(targetWord) : null;
            
            if (cleanTargetWord) {
                // 특정 단어/구간 선택 됨
                focusTitle = `[ ${cleanTargetWord} ] 심화 학습`;
                prompt = `원문 "${cleanFullText}"에서 사용자가 콕 집은 부분은 "${cleanTargetWord}" 입니다. 이 표현의 뜻과 쓰임새, 주의할 점, 예문 1개를 반드시 [${expLangName}] 언어로 친절하게 과외하듯 해설해. 마크다운으로 주요단어를 **굵게** 표시하고 결과만 출력해.`;
            } else {
                // 선택 안됨 -> 전체 문장 해설
                focusTitle = isExpSource ? `해설 내용 추가 족집게 분석` : `전체 문장 족집게 해설`;
                prompt = `문장 "${cleanFullText}" 의 전체적인 문법 구조나 가장 핵심적인 표현 1~2개를 골라, 반드시 [${expLangName}] 언어로 친절하게 과외하듯 해설해. 마크다운으로 주요단어를 **굵게** 표시하고 결과만 출력.`;
            }

            try {
                let explanation = "";
                if (selectedEngine === 'gemini') {
                    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] }) });
                    let data = await res.json(); explanation = data.candidates[0].content.parts[0].text;
                } else {
                    let res = await fetch("https://api.deepseek.com/v1/chat/completions", { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${deepseekApiKey}` }, body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] }) });
                    let data = await res.json(); explanation = data.choices[0].message.content;
                }

                if (explanation) {
                    bubbleCounter++;
                    const expBId = `exp-msg-${bubbleCounter}`;
                    
                    // TTS용 순수 텍스트
                    const pureExp = explanation.replace(/[\*\#\`]/g, '');
                    const esc = pureExp.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                    
                    // 시각용 텍스트 + 단어 쪼개기 (해설창 내부 터치 지원)
                    const visualExp = explanation.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    // <br> 태그를 임시로 치환 후 단어 쪼개고 복구
                    const tempVisualExp = visualExp.replace(/\n/g, ' [[BR]] ');
                    let spansHtml = createSpansForText(tempVisualExp, expBId, true);
                    spansHtml = spansHtml.replace(/\[\[BR\]\]/g, '<br>');

                    const msgDiv = document.createElement('div');
                    msgDiv.className = "flex flex-col space-y-1 mt-4";
                    msgDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 w-full shadow-md relative">
                            <div class="absolute top-2 right-2 flex gap-1">
                                <!-- 해설창 안의 전구(💡) 버튼 (꼬리물기 과외용) -->
                                <button onclick="requestExplanationFromBubble('${expBId}', '${esc}', true)" class="text-green-600 hover:bg-green-100 w-7 h-7 flex items-center justify-center rounded-full transition-colors shadow-sm border border-green-200 bg-white"><i class="fa-solid fa-lightbulb text-sm"></i></button>
                                <!-- 해설창 안의 스피커(🔊) 버튼 -->
                                <button onclick="speakText('${esc}', '${expLangCode}')" class="text-blue-500 hover:bg-blue-100 w-7 h-7 flex items-center justify-center rounded-full transition-colors shadow-sm border border-blue-200 bg-white"><i class="fa-solid fa-volume-high text-sm"></i></button>
                            </div>
                            <p class="text-xs font-bold text-yellow-800 mb-2"><i class="fa-solid fa-graduation-cap"></i> ${focusTitle}</p>
                            <p id="bubble-${expBId}" class="chat-text-dynamic text-gray-800 pr-14 leading-relaxed">${spansHtml}</p>
                        </div>`;
                    chatContainer.appendChild(msgDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    updateStatus("해설 완료");
                    clearSelection(); // 해설 완료 후 기존 선택 풀기
                }
            } catch(e) { updateStatus("해설 실패"); }
        }

        // --- General Settings ---
        function changeAppMode() { conversationHistory=[]; changeLanguage(); }
        function changeLanguage() { 
            conversationHistory=[]; 
            document.getElementById('sttInputLanguage').value = document.getElementById('targetLanguage').value;
            updateStatus("언어 설정 동기화 완료"); 
        }
        function changeEngine() { selectedEngine=document.getElementById('activeEngine').value; localStorage.setItem('active_engine',selectedEngine); }
        let tempGender = currentVoiceGender;
        function selectGender(g) { tempGender=g; updateGenderUI(g,false); }
        function updateGenderUI(g, applyImg=false) {
            if(g==='female') { document.getElementById('genderFemaleBtn').className="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600"; document.getElementById('genderMaleBtn').className="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-200"; if(applyImg) avatarImage.src="호두 꿀벌_2.jpg"; }
            else { document.getElementById('genderMaleBtn').className="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600"; document.getElementById('genderFemaleBtn').className="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-200"; if(applyImg) avatarImage.src="치타 팔짱_2.jpg"; }
        }
        function toggleSettingsModal(s=true) {
            let m=document.getElementById('settingsModal');
            if(s) { document.getElementById('geminiKeyInput').value=geminiApiKey; document.getElementById('deepseekKeyInput').value=deepseekApiKey; document.getElementById('fontSizeSlider').value=localStorage.getItem('chat_font_size')||14; m.classList.remove('hidden'); }
            else m.classList.add('hidden');
        }
        function saveSettings() {
            geminiApiKey=document.getElementById('geminiKeyInput').value.trim(); localStorage.setItem('gemini_api_key',geminiApiKey);
            deepseekApiKey=document.getElementById('deepseekKeyInput').value.trim(); localStorage.setItem('deepseek_api_key',deepseekApiKey);
            localStorage.setItem('chat_font_size', document.getElementById('fontSizeSlider').value);
            localStorage.setItem('explanation_language', document.getElementById('explanationLanguage').value);
            currentVoiceGender=tempGender; localStorage.setItem('voice_gender',currentVoiceGender); updateGenderUI(currentVoiceGender,true);
            toggleSettingsModal(false);
        }
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
