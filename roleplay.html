<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkAI - 실전 롤플레잉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-card { border-color: #3b82f6 !important; background-color: #eff6ff !important; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3) !important; transform: scale(1.02); }
        .playing-line { border-left: 4px solid #3b82f6; background-color: #f8fafc; transform: translateX(5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="p-0 sm:p-4">

    <div class="bg-white w-full max-w-md h-full sm:h-[850px] shadow-2xl flex flex-col sm:rounded-3xl overflow-hidden relative">
        
        <!-- 상단 헤더 -->
        <div class="flex-none bg-white border-b border-gray-100 p-4 flex items-center justify-between z-10 shadow-sm">
            <button class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200" onclick="alert('메인 화면으로 돌아갑니다')">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-lg font-bold text-gray-800">🎬 실전 롤플레잉</h1>
            <div class="w-10"></div>
        </div>

        <div id="scrollArea" class="flex-1 overflow-y-auto p-5 space-y-6 no-scrollbar pb-24">
            
            <!-- 1. 레벨 선택 섹션 -->
            <section>
                <h2 class="text-sm font-bold text-gray-500 mb-3"><i class="fa-solid fa-layer-group text-blue-500"></i> 1. 나의 레벨을 선택하세요</h2>
                <div class="grid grid-cols-4 gap-2">
                    <button class="py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all selected-card">입문</button>
                    <button class="py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">초급</button>
                    <button class="py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">중급</button>
                    <button class="py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">원어민</button>
                </div>
            </section>

            <!-- 2. 상황(페르소나) 선택 섹션 (가로 슬라이드 적용 버전만 남김) -->
            <section>
                <h2 class="text-sm font-bold text-gray-500 mb-3"><i class="fa-solid fa-masks-theater text-purple-500"></i> 2. 상황을 선택하세요</h2>
                
                <div class="flex overflow-x-auto gap-3 pb-2 snap-x no-scrollbar">
                    <div class="shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all selected-card snap-center">
                        <span class="text-3xl block mb-2">☕</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">카페 주문</span>
                    </div>
                    <div class="shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🛂</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">입국 심사대</span>
                    </div>
                    <div class="shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🛍️</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">옷가게 쇼핑</span>
                    </div>
                    <div class="shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🚕</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">택시 타기</span>
                    </div>
                </div>
                
                <!-- 💡 버튼에 ID 추가 -->
                <button id="generateBtn" class="w-full mt-4 bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-black transition-all">
                    ✨ AI 대본 생성하기
                </button>
            </section>

            <hr class="border-gray-200 border-dashed border-2 rounded-full my-4">

            <!-- 3. 대본 플레이어 영역 -->
            <section id="scriptPlayer">
                <div class="bg-blue-50 rounded-2xl p-4 mb-4 border border-blue-100">
                    <p class="text-xs text-blue-600 font-bold mb-1">상황 설명</p>
                    <p class="text-sm text-gray-700 font-medium leading-relaxed">원하는 레벨과 상황을 선택한 후 [AI 대본 생성하기]를 눌러주세요!</p>
                </div>
                <div class="space-y-4" id="scriptList">
                    <!-- 대본이 여기에 생성됩니다 -->
                </div>
            </section>

        </div>

        <!-- 하단 액션 컨트롤러 -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 px-4 py-4 pb-6 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] rounded-b-3xl">
            <div class="flex justify-between items-center gap-3">
                <button class="flex flex-col items-center justify-center w-16 h-14 rounded-2xl bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-repeat text-lg mb-1"></i>
                    <span class="text-[10px] font-bold">전체 듣기</span>
                </button>
                <button class="flex-1 h-14 rounded-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold shadow-lg shadow-blue-200 flex items-center justify-center gap-2 transform transition-transform hover:scale-105">
                    <i class="fa-solid fa-microphone text-xl"></i> 말하기 시작
                </button>
                <button class="flex flex-col items-center justify-center w-16 h-14 rounded-2xl bg-yellow-50 text-yellow-600 border border-yellow-200 hover:bg-yellow-100 transition-colors">
                    <i class="fa-solid fa-gamepad text-lg mb-1"></i>
                    <span class="text-[10px] font-bold text-yellow-700">빈칸 퀴즈</span>
                </button>
            </div>
        </div>

    </div>
    
    <script>
    // 💡 질문자님의 워커 주소로 변경하셔야 합니다.
    const WORKER_URL = "https://holy-tree-32c5.thin770.workers.dev/"; 
    
    let scriptData = []; 
    let currentPlayingIndex = 0;
    let isPlaying = false;
    let recognition = null;

    // 대본 생성 버튼 이벤트 연결
    document.getElementById("generateBtn").onclick = generateScript;

    async function generateScript(event) {
        const btn = event.target;
        btn.innerText = "⏳ 딥시크가 대본을 작성 중입니다...";
        btn.disabled = true;

        const level = "초급"; // 임시 하드코딩
        const situation = "카페 주문하기"; // 임시 하드코딩

        try {
            const response = await fetch(`${WORKER_URL}/generate-script`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: level, situation: situation })
            });

            const data = await response.json(); 
            scriptData = data.scriptData; 

            renderScript();
            alert("대본이 준비되었습니다! 하단의 듣기/말하기 버튼을 눌러보세요.");

        } catch (error) {
            alert("대본 생성에 실패했습니다. (워커 주소를 확인해주세요)");
            console.error(error);
        } finally {
            btn.innerText = "✨ AI 대본 생성하기";
            btn.disabled = false;
        }
    }

    function renderScript() {
        const playerArea = document.getElementById("scriptList");
        playerArea.innerHTML = ""; 

        scriptData.forEach(line => {
            const isAi = line.role === 'ai';
            const icon = isAi ? '👱‍♀️' : '👤';
            const roleName = isAi ? 'AI 상대방' : '나 (사용자)';
            const colorClass = isAi ? 'purple' : 'blue';

            const lineHtml = `
                <div class="flex gap-3 p-2 rounded-lg border border-transparent" id="line-${line.id}">
                    <div class="w-10 h-10 rounded-full bg-${colorClass}-100 flex items-center justify-center text-xl shrink-0">${icon}</div>
                    <div>
                        <p class="text-[11px] font-bold text-${colorClass}-600 mb-0.5">${roleName}</p>
                        <p class="text-sm font-bold text-gray-800">${line.en}</p>
                        <p class="text-xs text-gray-500 mt-1">${line.ko}</p>
                    </div>
                </div>
            `;
            playerArea.insertAdjacentHTML('beforeend', lineHtml);
        });
    }

    // STT (음성 인식) 초기화
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
    }

    function playAudiobook() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");
        
        if (isPlaying) {
            window.speechSynthesis.cancel();
            isPlaying = false;
            return;
        }

        isPlaying = true;
        currentPlayingIndex = 0;
        playNextLine();
    }

    function playNextLine() {
        if (!isPlaying || currentPlayingIndex >= scriptData.length) {
            isPlaying = false;
            return;
        }

        const line = scriptData[currentPlayingIndex];
        const utterance = new SpeechSynthesisUtterance(line.en);
        utterance.lang = 'en-US';
        utterance.pitch = line.role === 'ai' ? 1.2 : 0.8; 
        utterance.rate = 0.9;

        utterance.onend = () => {
            currentPlayingIndex++;
            setTimeout(playNextLine, 500);
        };

        window.speechSynthesis.speak(utterance);
    }

    function startShadowing() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");
        if (!recognition) return alert("이 브라우저에서는 음성 인식을 지원하지 않습니다.");

        const userLine = scriptData.find(d => d.role === 'user');
        alert(`🎤 다음 문장을 소리 내어 읽어보세요!\n\n"${userLine.en}"`);
        
        recognition.start();

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.toLowerCase();
            const targetText = userLine.en.toLowerCase().replace(/[.,!?]/g, ""); 
            
            const spokenWords = spokenText.split(" ");
            const targetWords = targetText.split(" ");
            let matchCount = 0;
            
            targetWords.forEach(word => {
                if (spokenWords.includes(word)) matchCount++;
            });
            
            const score = Math.round((matchCount / targetWords.length) * 100);
            
            if (score > 80) {
                alert(`🎉 완벽해요! (일치율 ${score}%)\n인식된 문장: ${spokenText}`);
            } else {
                alert(`💪 조금 더 연습해 볼까요? (일치율 ${score}%)\n인식된 문장: ${spokenText}`);
            }
        };

        recognition.onerror = () => {
            alert("음성을 인식하지 못했습니다. 다시 시도해 주세요.");
        };
    }

    function startQuizMode() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");

        const userLine = scriptData.find(d => d.role === 'user');
        const words = userLine.en.split(" ");
        
        const randomIdx = Math.floor(Math.random() * words.length);
        const answer = words[randomIdx].replace(/[.,!?]/g, ""); 
        
        words[randomIdx] = "______"; 
        const quizSentence = words.join(" ");

        const userInput = prompt(`⏳ 제한 시간! 빈칸에 들어갈 단어는?\n\n${quizSentence}`);
        
        if (userInput && userInput.toLowerCase() === answer.toLowerCase()) {
            alert("정답입니다! 콤보 +1 🔥");
        } else {
            alert(`앗, 틀렸습니다! 정답은 '${answer}' 입니다.`);
        }
    }

    // 버튼 이벤트 연결
    document.addEventListener("DOMContentLoaded", () => {
        const buttons = document.querySelectorAll(".absolute.bottom-0 button");
        buttons[0].onclick = playAudiobook; 
        buttons[1].onclick = startShadowing;
        buttons[2].onclick = startQuizMode; 
    });
    </script>
</body>
</html>
