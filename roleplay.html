<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkAI - 실전 롤플레잉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { background-color: #0f172a; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            touch-action: pan-y; /* 💡 브라우저의 기본 스와이프 간섭 방지 */
            animation: slideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-card { border-color: #3b82f6 !important; background-color: #eff6ff !important; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3) !important; transform: scale(1.02); }
    
        @keyframes slideIn {
            from { transform: translateX(100%); } /* opacity: 0 제거 */
            to { transform: translateX(0); }      /* opacity: 1 제거 */
        }
        /* 기존 .slide-out 과 @keyframes slideOut 은 삭제하셔도 됩니다 (JS가 대신함) */
        .slide-out {
            animation: slideOut 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="p-0 sm:p-4">

    <div class="bg-white w-full max-w-md h-full sm:h-[850px] shadow-2xl flex flex-col sm:rounded-3xl overflow-hidden relative">
        
        <!-- 상단 헤더 -->
        <div class="flex-none bg-white border-b border-gray-100 p-4 flex items-center justify-between z-10 shadow-sm">
            <button class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-lg font-bold text-gray-800">🎬 실전 롤플레잉</h1>
            <div class="w-10"></div>
        </div>

        <div id="scrollArea" class="flex-1 overflow-y-auto p-5 space-y-6 no-scrollbar pb-24">
            
            <section id="levelSection">
                <h2 class="text-sm font-bold text-gray-500 mb-3"><i class="fa-solid fa-layer-group text-blue-500"></i> 1. 나의 레벨을 선택하세요</h2>
                <div class="grid grid-cols-4 gap-2">
                    <button class="level-btn py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all selected-card">입문</button>
                    <button class="level-btn py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">초급</button>
                    <button class="level-btn py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">중급</button>
                    <button class="level-btn py-2 rounded-xl border-2 border-gray-100 bg-white text-xs font-bold text-gray-600 transition-all">원어민</button>
                </div>
            </section>

            <section id="situationSection">
                <h2 class="text-sm font-bold text-gray-500 mb-3"><i class="fa-solid fa-masks-theater text-purple-500"></i> 2. 상황을 선택하세요</h2>
                <div class="flex overflow-x-auto gap-3 pb-2 snap-x no-scrollbar">
                    <div class="sit-card shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all selected-card snap-center">
                        <span class="text-3xl block mb-2">☕</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">카페 주문</span>
                    </div>
                    <div class="sit-card shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🛂</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">입국 심사대</span>
                    </div>
                    <div class="sit-card shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🛍️</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">옷가게 쇼핑</span>
                    </div>
                    <div class="sit-card shrink-0 w-32 p-4 rounded-2xl border-2 border-gray-100 bg-white text-center cursor-pointer transition-all snap-center">
                        <span class="text-3xl block mb-2">🚕</span>
                        <span class="font-bold text-sm text-gray-800 whitespace-nowrap">택시 타기</span>
                    </div>
                </div>
                
                <button id="generateBtn" class="w-full mt-4 bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-black transition-all">
                    ✨ AI 대본 생성하기
                </button>
            </section>

            <hr class="border-gray-200 border-dashed border-2 rounded-full my-4">

            <section id="scriptPlayer">
                <div class="bg-blue-50 rounded-2xl p-4 mb-4 border border-blue-100">
                    <p class="text-xs text-blue-600 font-bold mb-1" id="statusBoxTitle">상황 설명</p>
                    <p class="text-sm text-gray-700 font-medium leading-relaxed" id="statusBoxText">원하는 레벨과 상황을 선택한 후 [AI 대본 생성하기]를 눌러주세요!</p>
                </div>
                <div class="space-y-4" id="scriptList">
                    <!-- 대본이 여기에 생성됩니다 -->
                </div>
            </section>
        </div>

        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 px-4 py-4 pb-6 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] rounded-b-3xl">
            <div class="flex justify-between items-center gap-3">
                <button onclick="playAudiobook()" class="flex flex-col items-center justify-center w-16 h-14 rounded-2xl bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-repeat text-lg mb-1"></i>
                    <span class="text-[10px] font-bold">전체 듣기</span>
                </button>
                <button onclick="startShadowing()" id="roleplayMicBtn" class="flex-1 h-14 rounded-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold shadow-lg shadow-blue-200 flex items-center justify-center gap-2 transform transition-transform hover:scale-105">
                    <i class="fa-solid fa-microphone text-xl" id="roleplayMicIcon"></i> <span id="roleplayMicText">말하기 시작</span>
                </button>
                <button onclick="startQuizMode()" class="flex flex-col items-center justify-center w-16 h-14 rounded-2xl bg-yellow-50 text-yellow-600 border border-yellow-200 hover:bg-yellow-100 transition-colors">
                    <i class="fa-solid fa-gamepad text-lg mb-1"></i>
                    <span class="text-[10px] font-bold text-yellow-700">빈칸 퀴즈</span>
                </button>
            </div>
        </div>
    </div>
    
    <script>
    

    // --- 💡 워커 주소 및 기본 변수 설정 (마이크 오류 해결을 위해 isListening 추가) ---
    const WORKER_URL = "https://holy-tree-32c5.thin770.workers.dev"; 
    
    let scriptData = []; 
    let currentPlayingIndex = 0;
    let isPlaying = false;
    let recognition = null;
    let isListening = false; // 💡 마이크 에러의 원인이었던 누락된 변수 추가!

    // --- 버튼 클릭 UI 효과 ---
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.onclick = (e) => {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected-card'));
            e.currentTarget.classList.add('selected-card');
        }
    });

    document.querySelectorAll('.sit-card').forEach(card => {
        card.onclick = (e) => {
            document.querySelectorAll('.sit-card').forEach(c => c.classList.remove('selected-card'));
            e.currentTarget.classList.add('selected-card');
        }
    });

    // --- 대본 생성 API ---
    document.getElementById("generateBtn").onclick = async (event) => {
        const btn = event.currentTarget;
        
        const selectedLevel = document.querySelector('.level-btn.selected-card').innerText.trim();
        const selectedSituation = document.querySelector('.sit-card.selected-card').innerText.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|\n/g, '').trim();

        btn.innerText = "⏳ 딥시크가 작성 중입니다...";
        btn.disabled = true;

        document.getElementById("statusBoxTitle").innerText = `[${selectedLevel}] ${selectedSituation}`;
        document.getElementById("statusBoxText").innerText = "잠시만 기다려주세요...";

        try {
            const response = await fetch(`${WORKER_URL}/generate-script`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: selectedLevel, situation: selectedSituation })
            });

            const data = await response.json(); 
            scriptData = data.scriptData; 

            renderScript();
            document.getElementById("statusBoxText").innerText = "대본이 준비되었습니다! 하단의 듣기/말하기 버튼을 눌러 연습하세요.";

        } catch (error) {
            alert("대본 생성에 실패했습니다. 서버 상태를 확인해주세요.");
        } finally {
            btn.innerHTML = "✨ AI 대본 생성하기";
            btn.disabled = false;
        }
    };

    function renderScript() {
        const playerArea = document.getElementById("scriptList");
        playerArea.innerHTML = ""; 

        scriptData.forEach(line => {
            const isAi = line.role === 'ai';
            const icon = isAi ? '👱‍♀️' : '👤';
            const roleName = isAi ? 'AI 상대방' : '나 (사용자)';
            const colorClass = isAi ? 'purple' : 'blue';

            const lineHtml = `
                <div class="flex gap-3 p-2 rounded-lg border border-transparent">
                    <div class="w-10 h-10 rounded-full bg-${colorClass}-100 flex items-center justify-center text-xl shrink-0">${icon}</div>
                    <div>
                        <p class="text-[11px] font-bold text-${colorClass}-600 mb-0.5">${roleName}</p>
                        <p class="text-sm font-bold text-gray-800">${line.en}</p>
                        <p class="text-xs text-gray-500 mt-1">${line.ko}</p>
                    </div>
                </div>
            `;
            playerArea.insertAdjacentHTML('beforeend', lineHtml);
        });
    }

    // --- 마이크 기능 초기화 ---
    const SpeechReq = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechReq) {
        recognition = new SpeechReq();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
    }

    function playAudiobook() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");
        
        if (isPlaying) {
            window.speechSynthesis.cancel();
            isPlaying = false;
            return;
        }
        isPlaying = true;
        currentPlayingIndex = 0;
        playNextLine();
    }

    function playNextLine() {
        if (!isPlaying || currentPlayingIndex >= scriptData.length) {
            isPlaying = false;
            return;
        }

        const line = scriptData[currentPlayingIndex];
        const utterance = new SpeechSynthesisUtterance(line.en);
        utterance.lang = 'en-US';
        utterance.pitch = line.role === 'ai' ? 1.2 : 0.8; 
        
        utterance.onend = () => {
            currentPlayingIndex++;
            setTimeout(playNextLine, 500);
        };
        window.speechSynthesis.speak(utterance);
    }

    function startShadowing() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");
        if (!recognition) return alert("이 브라우저에서는 마이크를 지원하지 않습니다.");

        const userLine = scriptData.find(d => d.role === 'user');
        if(!userLine) return alert("사용자가 읽을 대사가 없습니다.");

        const btn = document.getElementById("roleplayMicBtn");
        const icon = document.getElementById("roleplayMicIcon");
        const text = document.getElementById("roleplayMicText");

        if (isListening) {
            recognition.stop();
            return;
        }

        btn.classList.replace("from-blue-600", "from-red-500");
        btn.classList.replace("to-blue-500", "to-red-600");
        icon.classList.replace("fa-microphone", "fa-ear-listen");
        text.innerText = "듣고 있습니다...";

        alert(`🎤 다음 문장을 소리 내어 읽어보세요!\n\n"${userLine.en}"`);
        
        try { 
            recognition.lang = 'en-US';
            recognition.start(); 
            isListening = true;
        } catch(e) { console.log("마이크 시작 에러", e); }

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.toLowerCase();
            const targetText = userLine.en.toLowerCase().replace(/[.,!?]/g, ""); 
            
            const spokenWords = spokenText.split(" ");
            const targetWords = targetText.split(" ");
            let matchCount = 0;
            
            targetWords.forEach(word => { if (spokenWords.includes(word)) matchCount++; });
            const score = Math.round((matchCount / targetWords.length) * 100);
            
            if (score > 80) alert(`🎉 완벽해요! (일치율 ${score}%)\n인식된 문장: ${spokenText}`);
            else alert(`💪 조금 더 연습해 볼까요? (일치율 ${score}%)\n인식된 문장: ${spokenText}`);
        };

        recognition.onend = () => {
            isListening = false;
            btn.classList.replace("from-red-500", "from-blue-600");
            btn.classList.replace("to-red-600", "to-blue-500");
            icon.classList.replace("fa-ear-listen", "fa-microphone");
            text.innerText = "말하기 시작";
        };
        
        recognition.onerror = () => {
            isListening = false;
            alert("음성 인식에 실패했습니다. 다시 시도해주세요.");
        }
    }

    function startQuizMode() {
        if (scriptData.length === 0) return alert("먼저 대본을 생성해주세요!");

        const userLine = scriptData.find(d => d.role === 'user');
        const words = userLine.en.split(" ");
        const randomIdx = Math.floor(Math.random() * words.length);
        const answer = words[randomIdx].replace(/[.,!?]/g, ""); 
        
        words[randomIdx] = "______"; 
        const quizSentence = words.join(" ");

        const userInput = prompt(`⏳ 제한 시간! 빈칸에 들어갈 단어는?\n\n${quizSentence}`);
        
        if (userInput && userInput.toLowerCase() === answer.toLowerCase()) alert("정답입니다! 콤보 +1 🔥");
        else alert(`앗, 틀렸습니다! 정답은 '${answer}' 입니다.`);
    }

    // --- 💡 메뉴 스크롤과 겹치지 않는 확실한 스와이프 ---
    function goBack() {
        d// --- 💡 앱처럼 손가락을 따라오는 부드러운 스와이프 (뒤로가기) ---
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwipingRight = false;

    window.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isSwipingRight = false;
        document.body.style.transition = 'none'; // 드래그 중 애니메이션 끄기
    }, { passive: true }); 

    window.addEventListener('touchmove', (e) => {
        // 화면 왼쪽 끝(40px 이내)에서 터치가 시작되었을 때만 작동
        if (touchStartX < 40) {
            let currentX = e.touches[0].clientX;
            let moveX = currentX - touchStartX; // 오른쪽으로 밀면 양수
            let moveY = Math.abs(e.touches[0].clientY - touchStartY);

            if (moveX > moveY && moveX > 0) {
                e.preventDefault(); 
                isSwipingRight = true;
                document.body.style.transform = `translateX(${moveX}px)`; // 손가락 따라 화면 이동
            }
        }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
        if (!isSwipingRight) return;
        
        let touchEndX = e.changedTouches[0].clientX;
        let moveX = touchEndX - touchStartX; 

        document.body.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';

        if (moveX > 70) {
            // 충분히 밀었으면 완전히 오른쪽으로 치우기
            document.body.style.transform = `translateX(100%)`;
            setTimeout(() => { window.location.href = "index.html"; }, 300);
        } else {
            // 밀다 말았으면 원상복구
            document.body.style.transform = `translateX(0)`;
        }
    }, { passive: true });

    // 뒤로가기 화살표 버튼을 눌렀을 때의 동작
    function goBack() {
        document.body.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
        document.body.style.transform = `translateX(100%)`;
        setTimeout(() => { window.location.href = "index.html"; }, 300);
    }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    
    window.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true, capture: true }); 

    window.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].clientX;
        let touchEndY = e.changedTouches[0].clientY;
        
        let moveX = touchEndX - touchStartX;
        let moveY = Math.abs(touchEndY - touchStartY);

        // 💡 수정됨: 화면 완전 끝(30px 이내)에서만 시작해야 작동함. 이제 가운데 메뉴를 밀어도 안 넘어갑니다!
        if (touchStartX < 30 && moveX > 60 && moveX > moveY) {
            goBack();
        }
    }, { passive: true, capture: true });
    </script>
</body>
</html>
